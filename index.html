<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PSY385 Class Activities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow phone-first column; a home list of activities, each activity is its own view opened by #token */
:root{
  --bg:#F3F8F7; --surface:#FFFFFF; --ink:#13302F; --muted:#4F6B69; --line:#D3E3E0;
  --teal:#0D7F75; --teal-soft:#E1F3F0; --amber:#B86E00; --amber-soft:#FFF1D6; --good:#17803D; --bad:#B42318;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A1A; --surface:#152626; --ink:#E6F2F0; --muted:#9DB8B4; --line:#2A4442;
  --teal:#3CC5B6; --teal-soft:#183A37; --amber:#F5B547; --amber-soft:#3A2E14; --good:#4ACB7A; --bad:#F2746B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A1A; --surface:#152626; --ink:#E6F2F0; --muted:#9DB8B4; --line:#2A4442;
  --teal:#3CC5B6; --teal-soft:#183A37; --amber:#F5B547; --amber-soft:#3A2E14; --good:#4ACB7A; --bad:#F2746B; color-scheme:dark}
html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.9rem} h2{font-size:1.45rem}
p{margin:0}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--teal)}
.muted{color:var(--muted)}
.day{display:flex;flex-direction:column;gap:10px}
.day h3{margin:6px 0 0;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
a.tile{display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none}
a.tile:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
a.tile .k{flex:0 0 auto;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--teal-soft);color:var(--teal);width:118px;box-sizing:border-box;text-align:center}
a.tile b{display:block} a.tile span.s{font-size:.9rem;color:var(--muted)}
.back{align-self:flex-start;background:none;border:0;color:var(--teal);font:600 1rem var(--body);padding:4px 0;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.q{font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:500 1rem var(--body);cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.fb{padding:10px 12px;border-radius:10px;background:var(--amber-soft);font-size:.95rem}
.scale{display:grid;gap:6px}
.scale button{padding:10px 0;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:600 1rem var(--body);cursor:pointer;font-variant-numeric:tabular-nums}
.scale button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.legend{font-size:.82rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.primary{align-self:flex-start;padding:12px 18px;border-radius:10px;border:0;background:var(--teal);color:var(--surface);font:700 1rem var(--body);cursor:pointer}
.primary:disabled{opacity:.45;cursor:not-allowed}
.result{background:var(--teal-soft);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.big{font-family:var(--display);font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
textarea{width:100%;box-sizing:border-box;min-height:84px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:1rem/1.45 var(--body);resize:vertical}
label.f{font-weight:600;display:flex;flex-direction:column;gap:6px}
label.f small{font-weight:400;color:var(--muted)}
.timer{font-family:var(--display);font-size:2.2rem;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ghost{padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:none;color:var(--ink);font:600 .95rem var(--body);cursor:pointer}
.note{font-size:.85rem;color:var(--muted)}
.progress{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.opt,.scale button{transition:background .15s,border-color .15s}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>
const DATA = {
 home:{},
 mlq:{day:0,kind:"Questionnaire",title:"Meaning in Life Questionnaire",sub:"MLQ · 10 items · Steger et al. (2006)",type:"scale",
  intro:"Rate each statement for your life right now. Your answers stay on your phone.",
  labels:["Absolutely untrue","Mostly untrue","Somewhat untrue","Can’t say true or false","Somewhat true","Mostly true","Absolutely true"],values:[1,2,3,4,5,6,7],
  items:["I understand my life’s meaning.","I am looking for something that makes my life feel meaningful.","I am always looking to find my life’s purpose.","My life has a clear sense of purpose.","I have a good sense of what makes my life meaningful.","I have discovered a satisfying life purpose.","I am always searching for something that makes my life feel significant.","I am seeking a purpose or mission for my life.","My life has no clear purpose.","I am searching for meaning in my life."],
  score(a){const p=a[0]+a[3]+a[4]+a[5]+(8-a[8]),se=a[1]+a[2]+a[6]+a[7]+a[9];
   const v=p>24&&se>24?"Meaning is present, and you are still exploring it.":p>24?"Your life feels meaningful, and you are not actively searching right now.":se>24?"You are still searching for meaning. This is very common at university.":"You are not focused on meaning right now. Notice which activities and people feel worthwhile to you.";
   return {main:p,max:35,label:"Presence of meaning (5–35)",text:`Search for meaning: ${se} out of 35. ${v}`,
    detail:"Scoring: presence = items 1, 4, 5, 6 and 9 (item 9 reversed: 8 minus your answer). Search = items 2, 3, 7, 8 and 10. 24 is the cut-off used in class. Source: Steger et al. (2006), textbook pp. 89–90."}}},
 // ---------------- DAY 1 ----------------
 glass:{day:1,kind:"Poll",title:"Warm-up poll: half full or half empty?",sub:"Two quick questions before we start",
  type:"poll",items:[
   {q:"When you think about the next five years, you mostly expect…",o:["Things will go well for me","A mix of good and bad","Things will probably go badly"],
    after:"Expecting good outcomes in general is what Scheier and Carver call dispositional optimism. Hold on to your answer: you will test it with the LOT-R today."},
   {q:"Can a person learn to become more optimistic?",o:["Yes, it is a skill","Partly","No, you are born that way"],
    after:"Both answers have support. Seligman treats optimism as a learned way of explaining events; Scheier and Carver treat it as a fairly stable trait. About 25–30% of the differences between people are linked to genes."}]},
 lotr:{day:1,kind:"Questionnaire",title:"LOT-R: how optimistic are you?",sub:"Life Orientation Test – Revised · 10 items · 2 minutes",
  type:"scale",intro:"Answer honestly for yourself, not how you think most people would answer. Your answers stay on your phone.",
  labels:["I disagree a lot","I disagree a little","Neither","I agree a little","I agree a lot"],values:[0,1,2,3,4],
  items:["In uncertain times, I usually expect the best.","It’s easy for me to relax.","If something can go wrong for me, it will.","I’m always optimistic about my future.","I enjoy my friends a lot.","It’s important for me to keep busy.","I hardly ever expect things to go my way.","I don’t get upset too easily.","I rarely count on good things happening to me.","Overall, I expect more good things to happen to me than bad."],
  score(a){const r=v=>4-v;const s=a[0]+a[3]+a[9]+r(a[2])+r(a[6])+r(a[8]);
   return {main:s,max:24,label:"Optimism score (0–24)",
    text:"Higher scores mean more optimism. There are no official cut-offs. Many student samples average around 14–15.",
    detail:"How it is scored: items 2, 5, 6 and 8 are fillers and are not counted. Items 3, 7 and 9 are pessimism items, so they are reversed (4 becomes 0, 3 becomes 1). Source: Scheier, Carver & Bridges (1994), in your textbook p. 111."}}},
 threeps:{day:1,kind:"Quick check",title:"The 3 Ps: spot the explanation",sub:"6 statements · which dimension is it about?",
  type:"quiz",intro:"Each student just got a bad result. Which dimension of explanatory style does his explanation show?",
  items:[
   {q:"Yousef fails a quiz: “I’m always bad at tests. It will never change.”",o:["Permanence","Pervasiveness","Personalisation"],a:0,why:"“Always” and “never change” describe a stable cause. That is the pessimistic side of permanence."},
   {q:"Talal fails a quiz: “I failed this one, so my whole semester is ruined.”",o:["Permanence","Pervasiveness","Personalisation"],a:1,why:"One quiz is spreading to everything (global). That is the pessimistic side of pervasiveness."},
   {q:"Hamad’s project is rejected: “It’s completely my fault. I’m useless.”",o:["Permanence","Pervasiveness","Personalisation"],a:2,why:"He blames only himself (internal). That is the pessimistic side of personalisation."},
   {q:"Fahad loses a match: “We played badly today; next week will be different.”",o:["Permanence","Pervasiveness","Personalisation"],a:0,why:"“Today” and “next week will be different” describe an unstable, temporary cause. That is the optimistic side of permanence."},
   {q:"Nawaf gets a low lab grade: “Lab reports are my weak spot, but my other courses are fine.”",o:["Permanence","Pervasiveness","Personalisation"],a:1,why:"He keeps the problem specific (local). That is the optimistic side of pervasiveness."},
   {q:"Sultan’s presentation goes badly: “The projector failed and the room was noisy.”",o:["Permanence","Pervasiveness","Personalisation"],a:2,why:"He points to outside causes (external). Be careful: research shows stability and globality matter more than internal vs. external."}]},
 abc:{day:1,kind:"Activity",title:"Learning your ABCs",sub:"Turn one setback into a more optimistic explanation",
  type:"abc"},
 quiz1:{day:1,kind:"Quiz",title:"Day 1 exit quiz",sub:"6 questions · instant feedback",type:"quiz",
  items:[
   {q:"Dispositional optimism is best described as…",o:["A broad expectation that outcomes will be good","A way of explaining past failures","The belief that luck controls your life","Thinking that bad things never happen"],a:0,why:"Scheier and Carver define it as a trait: a general expectancy of good outcomes."},
   {q:"Which questionnaire measures dispositional optimism?",o:["ASQ","LOT-R","GSE","MLQ"],a:1,why:"The Life Orientation Test – Revised (10 items). The ASQ measures explanatory style."},
   {q:"A pessimist explains a bad event as…",o:["External, unstable, local","Internal, stable, global","External, stable, local","Internal, unstable, local"],a:1,why:"“It’s me, it will last, and it affects everything.”"},
   {q:"In the ABC model, what is “C”?",o:["Confidence","Control","Consequence","Coping"],a:2,why:"Adversity → Belief → Consequence (your feelings and actions)."},
   {q:"Optimists usually cope with stress by…",o:["Denial and distraction","Planning and seeking support","Giving up early","Ignoring health warnings"],a:1,why:"Optimism predicts active coping; pessimism predicts avoidant coping."},
   {q:"A 2019 review of about 230,000 people found optimists had…",o:["No difference in heart health","About 35% lower risk of heart attack, stroke or cardiac death","Twice the risk of heart disease","Lower grades"],a:1,why:"Rozanski et al. (2019). The link is correlational, so it does not prove optimism causes better health."}]},
 // ---------------- DAY 2 ----------------
 exam:{day:2,kind:"Poll",title:"Warm-up poll: the night before a big exam",sub:"One question, then see what research says",type:"poll",
  items:[{q:"The night before a big exam, you usually…",o:["Expect it to go well and try to relax","Imagine everything that could go wrong, then prepare for each one","Try not to think about it at all"],
   after:"Option 2 is defensive pessimism: setting low expectations and planning for the worst. For anxious students it can work as well as optimism. Option 3 is avoidance, which tends to work worst."}]},
 control:{day:2,kind:"Quick check",title:"Internal or external?",sub:"Locus of control · 5 statements",type:"quiz",intro:"Is each student showing an internal or an external locus of control?",
  items:[
   {q:"Abdullah: “I got an A because I studied every day for two weeks.”",o:["Internal","External"],a:0,why:"He links the result to his own effort."},
   {q:"Bader: “Grades depend on which instructor you get. Nothing I do changes it.”",o:["Internal","External"],a:1,why:"He believes powerful others decide the outcome."},
   {q:"Mubarak: “I lost because the other team was lucky.”",o:["Internal","External"],a:1,why:"Luck or chance is an external cause."},
   {q:"Saud: “If I practise my presentation, I can control how nervous I look.”",o:["Internal","External"],a:0,why:"He sees his own actions as making the difference."},
   {q:"Meshari: “Whether I get the internship is in God’s hands, but I will prepare as hard as I can.”",o:["Internal","External"],a:0,why:"A mix: he accepts what he cannot control and still takes responsibility for effort. The textbook notes LOC can vary by situation."}]},
 gse:{day:2,kind:"Questionnaire",title:"General Self-Efficacy Scale",sub:"GSE · 10 items · 2 minutes",type:"scale",
  intro:"How true is each statement about you? Your answers stay on your phone.",
  labels:["Not at all true","Hardly true","Moderately true","Exactly true"],values:[1,2,3,4],
  items:["I can always manage to solve difficult problems if I try hard enough.","If someone opposes me, I can find the means and ways to get what I want.","It is easy for me to stick to my aims and accomplish my goals.","I am confident that I could deal efficiently with unexpected events.","Thanks to my resourcefulness, I know how to handle unforeseen situations.","I can solve most problems if I invest the necessary effort.","I can remain calm when facing difficulties because I can rely on my coping abilities.","When I am confronted with a problem, I can usually find several solutions.","If I am in trouble, I can usually think of a solution.","I can usually handle whatever comes my way."],
  score(a){const s=a.reduce((x,y)=>x+y,0);return {main:s,max:40,label:"Self-efficacy score (10–40)",
   text:`Your average item score is ${(s/10).toFixed(1)} out of 4. The textbook reports an average total of about 29. There is no cut-off.`,
   detail:"Source: Schwarzer & Jerusalem (1995), in your textbook pp. 112–113. Remember: self-efficacy is specific to tasks and situations, so your score may differ for exams, sport or public speaking."}}},
 sources:{day:2,kind:"Quick check",title:"Where does self-efficacy come from?",sub:"Bandura’s sources · 4 scenarios",type:"quiz",
  items:[
   {q:"Khaled finally solves a hard coding problem on his own. Now he believes he can do the next one.",o:["Mastery experience","Vicarious experience","Verbal persuasion","Imaginal experience"],a:0,why:"His own direct success. This is the most powerful source."},
   {q:"Ali watches a classmate from his own section give a great presentation and thinks, “If he can, I can.”",o:["Mastery experience","Vicarious experience","Verbal persuasion","Imaginal experience"],a:1,why:"Learning by watching a similar model. The closer you identify with the model, the stronger the effect."},
   {q:"Faisal’s supervisor tells him, “You’re ready to lead this site visit.”",o:["Mastery experience","Vicarious experience","Verbal persuasion","Imaginal experience"],a:2,why:"Encouragement from someone else."},
   {q:"Before his interview, Yaqoub pictures himself answering every question calmly.",o:["Mastery experience","Vicarious experience","Verbal persuasion","Imaginal experience"],a:3,why:"Imagining yourself acting effectively (Maddux, 2002)."}]},
 hope:{day:2,kind:"Questionnaire",title:"Adult Hope Scale",sub:"12 items · agency and pathways · 3 minutes",type:"scale",
  intro:"How true is each statement about you? Your answers stay on your phone.",
  labels:["Definitely false","Mostly false","Somewhat false","Slightly false","Slightly true","Somewhat true","Mostly true","Definitely true"],values:[1,2,3,4,5,6,7,8],
  items:["I can think of many ways to get out of a jam.","I energetically pursue my goals.","I feel tired most of the time.","There are lots of ways around any problem.","I am easily downed in an argument.","I can think of many ways to get the things in life that are important to me.","I worry about my health.","Even when others get discouraged, I know I can find a way to solve the problem.","My past experiences have prepared me well for my future.","I’ve been pretty successful in life.","I usually find myself worrying about something.","I meet the goals that I set for myself."],
  score(a){const ag=a[1]+a[8]+a[9]+a[11],pa=a[0]+a[3]+a[5]+a[7];return {main:ag+pa,max:64,label:"Total hope (8–64)",
   text:`Agency (the will): ${ag} out of 32 · Pathways (the ways): ${pa} out of 32. Higher means more hope. Compare your two parts: which one is stronger?`,
   detail:"Scoring: agency = items 2, 9, 10, 12; pathways = items 1, 4, 6, 8. Items 3, 5, 7 and 11 are fillers. Source: Snyder et al. (1991)."}}},
 bps:{day:2,kind:"Activity",title:"Best Possible Self",sub:"5-minute writing exercise",type:"bps"},
 quiz2:{day:2,kind:"Quiz",title:"Day 2 exit quiz",sub:"6 questions · instant feedback",type:"quiz",
  items:[
   {q:"Defensive pessimists…",o:["Never prepare","Set low expectations and plan for problems","Always perform worse than optimists","Have an external locus of control"],a:1,why:"Norem and Cantor (1986). They do worse if they are stopped from planning for the worst."},
   {q:"Thinking you are less likely than average to have a car accident is…",o:["Defensive pessimism","Unrealistic optimism","Self-efficacy","Collective efficacy"],a:1,why:"An optimistic bias in risk perception."},
   {q:"In Langer and Rodin’s (1976) study, residents who were given choices and a plant…",o:["Felt worse","Showed no change","Were more active and had lower mortality","Became more pessimistic"],a:2,why:"Mortality was 15% vs. 30% about 15 months later. A related study (Schulz & Hanusa, 1978) found that benefits faded when the sense of control was later taken away."},
   {q:"Self-efficacy is best described as…",o:["A fixed personality trait","Your overall self-worth","Belief that you can do a specific task","Your actual level of skill"],a:2,why:"“The power of I can”: domain-specific and not the same as skill or self-esteem."},
   {q:"In Snyder’s hope theory, “pathways” means…",o:["The will to keep going","Being able to find routes to your goals","Expecting good things in general","Explaining failure as temporary"],a:1,why:"Hope = agency (the will) + pathways (the ways)."},
   {q:"Which intervention had the strongest effect on optimism in a 2017 meta-analysis?",o:["Positive affirmations","Best Possible Self","Watching comedy","Sleep training"],a:1,why:"Malouff and Schutte (2017) pooled 29 trials: optimism rose overall (g = .41), and Best Possible Self had the largest effects."}]}
};

const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function home(){
  const day=n=>Object.entries(DATA).filter(([k,v])=>k!=='home'&&v.day===n).map(([k,v])=>
    `<a class="tile" href="#${k}" data-go="${k}"><span class="k">${v.kind}</span><span><b>${esc(v.title)}</b><span class="s">${esc(v.sub)}</span></span></a>`).join('');
  app.innerHTML=`<div><p class="eyebrow">PSY385 Positive Psychology · AUM</p><h1>Class Activities</h1></div>
  <p class="muted">Scan the QR code on the slide, or pick the activity your instructor names. Nothing you enter leaves your phone.</p>
  <section class="day"><h3>Chapter 4 · Eudaimonic wellbeing</h3>${day(0)}</section>
  <p class="eyebrow" style="margin-top:8px">Chapter 5 · Optimism, Explanatory Style and Hope</p>
  <section class="day"><h3>Day 1 · Optimism and explanatory style</h3>${day(1)}</section>
  <section class="day"><h3>Day 2 · Control, the three selves and hope</h3>${day(2)}</section>`;
}
function header(v){return `<button class="back" data-go="">← All activities</button><div><p class="eyebrow">${v.day?"Chapter 5 · Day "+v.day:"Chapter 4"} · ${v.kind}</p><h2>${esc(v.title)}</h2></div>${v.intro?`<p class="muted">${esc(v.intro)}</p>`:''}`}

function poll(k,v){
  const saved=store.get('p_'+k)||{};
  app.innerHTML=header(v)+v.items.map((it,i)=>`<div class="card"><p class="q">${esc(it.q)}</p><div class="opts">${it.o.map((o,j)=>
    `<button class="opt" data-i="${i}" data-j="${j}" aria-pressed="${saved[i]===j}">${esc(o)}</button>`).join('')}</div>
    <p class="fb" id="pf${i}" ${saved[i]===undefined?'hidden':''}>${esc(it.after)}</p></div>`).join('')+
    `<p class="note">Your instructor will ask for a show of hands, so remember your answer.</p>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,j=+b.dataset.j;saved[i]=j;store.set('p_'+k,saved);
    app.querySelectorAll(`.opt[data-i="${i}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));document.getElementById('pf'+i).hidden=false;});
}
function quiz(k,v){
  let right=0,done=0;
  app.innerHTML=header(v)+v.items.map((it,i)=>`<div class="card"><p class="progress">Question ${i+1} of ${v.items.length}</p><p class="q">${esc(it.q)}</p><div class="opts">${it.o.map((o,j)=>
   `<button class="opt" data-i="${i}" data-j="${j}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}</div><p class="fb" id="qf${i}" hidden></p></div>`).join('')+
   `<div class="result" id="qres" hidden></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,j=+b.dataset.j,it=v.items[i];
    const group=app.querySelectorAll(`.opt[data-i="${i}"]`);if(group[0].disabled)return;
    group.forEach((x,n)=>{x.disabled=true;if(n===it.a)x.classList.add('right');});
    if(j!==it.a)b.classList.add('wrong');else right++;done++;
    const f=document.getElementById('qf'+i);f.hidden=false;f.textContent=(j===it.a?'Correct. ':'Not quite. ')+it.why;
    if(done===v.items.length){const r=document.getElementById('qres');r.hidden=false;
      r.innerHTML=`<p class="eyebrow">Your score</p><p class="big">${right} / ${v.items.length}</p><p>Review any question you missed, then show your instructor your score.</p>`;}
  });
}
function scale(k,v){
  const ans=new Array(v.items.length).fill(null);
  const cols=v.values.length;
  app.innerHTML=header(v)+`<div class="card"><p class="note">${v.values.map((n,i)=>`${n} = ${esc(v.labels[i])}`).join(' · ')}</p></div>`+
   v.items.map((it,i)=>`<div class="card"><p class="q">${i+1}. ${esc(it)}</p><div class="scale" style="grid-template-columns:repeat(${cols},1fr)">${v.values.map(n=>
   `<button data-i="${i}" data-n="${n}" aria-pressed="false" aria-label="${esc(v.labels[v.values.indexOf(n)])}">${n}</button>`).join('')}</div>
   <div class="legend"><span>${esc(v.labels[0])}</span><span>${esc(v.labels[cols-1])}</span></div></div>`).join('')+
   `<p class="progress" id="prog">0 of ${v.items.length} answered</p><button class="primary" id="go" disabled>See my score</button><div class="result" id="res" hidden></div>`;
  const go=document.getElementById('go');
  app.querySelectorAll('.scale button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;ans[i]=+b.dataset.n;
    app.querySelectorAll(`.scale button[data-i="${i}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));
    const c=ans.filter(x=>x!==null).length;document.getElementById('prog').textContent=`${c} of ${v.items.length} answered`;go.disabled=c<v.items.length;});
  go.onclick=()=>{const s=v.score(ans),r=document.getElementById('res');r.hidden=false;
    r.innerHTML=`<p class="eyebrow">${esc(s.label)}</p><p class="big">${s.main}</p><div class="bar"><i style="width:${Math.round(s.main/s.max*100)}%"></i></div><p>${esc(s.text)}</p><p class="note">${esc(s.detail)}</p><p class="note">This is a learning exercise, not a diagnosis. Your answers are not sent anywhere.</p>`;
    r.scrollIntoView({behavior:'smooth',block:'start'});};
}
function abc(k,v){
  const d=store.get('abc')||{};
  const F=[["a","A · Adversity","Just the facts: who, what, when, where. Example: “I got 11/20 on my Statics quiz.”"],
    ["b","B · Belief","Your first automatic thought about why it happened and what will happen next."],
    ["c","C · Consequence","How did that belief make you feel and act?"],
    ["d","D · Disputation","Argue with the belief like a fair friend. Is it permanent? Does it affect everything? Is it all your fault? What is the evidence?"],
    ["e","E · Energisation","How do you feel and what will you do now, after disputing?"]];
  app.innerHTML=header(v)+`<p class="muted">Seligman’s ABC model (textbook p. 98), with the D and E steps used in learned-optimism training. Think of one recent setback at university.</p>`+
   F.map(([id,l,h])=>`<div class="card"><label class="f" for="abc_${id}">${l}<small>${h}</small><textarea id="abc_${id}">${esc(d[id]||'')}</textarea></label></div>`).join('')+
   `<p class="note">Saved on this phone only. Your instructor may ask volunteers to share their D step.</p>`;
  F.forEach(([id])=>{const t=document.getElementById('abc_'+id);t.oninput=()=>{d[id]=t.value;store.set('abc',d)}});
}
let tick=null;
function bps(k,v){
  const d=store.get('bps')||'';
  app.innerHTML=header(v)+`<div class="card"><p>Imagine your life ten years from now. Everything has gone as well as it possibly could. You worked hard and reached your goals. Write about what you see: your work, your family, your health, your community.</p>
   <p class="muted">Then list one or two small steps you could take this month toward that future (Sheldon & Lyubomirsky, 2006; textbook p. 110).</p></div>
   <div class="card"><div class="row"><span class="timer" id="tm">5:00</span><button class="primary" id="tst">Start 5-minute timer</button><button class="ghost" id="trs">Reset</button></div>
   <label class="f" for="bpsText">My best possible self<textarea id="bpsText" style="min-height:220px">${esc(d)}</textarea></label></div>
   <p class="note">Saved on this phone only. For the full exercise, repeat it for 20 minutes on three days in a row.</p>`;
  const tm=document.getElementById('tm');let left=300;
  const show=()=>tm.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
  document.getElementById('tst').onclick=()=>{if(tick)return;tick=setInterval(()=>{left=Math.max(0,left-1);show();if(!left){clearInterval(tick);tick=null;tm.textContent="Time!";}},1000)};
  document.getElementById('trs').onclick=()=>{clearInterval(tick);tick=null;left=300;show()};
  const t=document.getElementById('bpsText');t.oninput=()=>store.set('bps',t.value);
}
function route(){
  if(tick){clearInterval(tick);tick=null}
  const k=(location.hash||'').slice(1);const v=DATA[k];
  if(!v||k==='home'){home();}
  else ({poll,quiz,scale,abc,bps})[v.type](k,v);
  app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();const g=b.dataset.go;
    try{history.replaceState(null,'',g?'#'+g:location.pathname)}catch(x){} show(g)}));
  window.scrollTo(0,0);
}
function show(g){const v=DATA[g];if(tick){clearInterval(tick);tick=null}
  if(!v||g==='home')home();else ({poll,quiz,scale,abc,bps})[v.type](g,v);
  app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();const n=b.dataset.go;try{history.replaceState(null,'',n?'#'+n:location.pathname)}catch(x){} show(n)}));
  window.scrollTo(0,0);}
window.addEventListener('hashchange',route);
route();
</script>
