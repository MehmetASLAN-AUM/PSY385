 ther10:{day:102,chap:"Chapter 10 · Part 2",kind:"Quick check",title:"Which approach fits?",sub:"Positive therapy and coaching · 5 scenarios",type:"quiz",intro:"Which approach is being used in each case?",
  items:[
   {q:"A therapist helps Yousef challenge the belief “I must be perfect or I’m worthless.”",o:["Rational emotive behaviour therapy","Well-being therapy","Coaching","Quality of life therapy"],a:0,why:"Restructuring irrational beliefs to live a more rational, fulfilling life is REBT."},
   {q:"Bader keeps a diary of moments when he felt in control, growing or connected, and discusses them in 8 sessions.",o:["Acceptance and commitment therapy","Well-being therapy","Executive coaching","Positive education"],a:1,why:"Well-being therapy: 8 sessions, a structured diary of well-being episodes based on Ryff’s model."},

 school10:{day:102,chap:"Chapter 10 · Part 2",kind:"Survey",title:"How positive is our university?",sub:"Features of a good school · 6 items",type:"scale",
  intro:"Think about AUM. How true is each statement? Your answers stay on your phone.",
  labels:["Not true","Slightly true","Somewhat true","Mostly true","Very true"],values:[1,2,3,4,5],
  items:["I feel safe on campus.","The university has a clear, shared purpose that I understand.","My courses set clear goals for students.","Instructors pay attention to me as an individual.","My effort and improvement are recognised, not just my grades.","I feel that I belong here."],
  score(a){const N=["Safety","Shared purpose","Clear goals","Individual attention","Recognising effort","Belonging"];const m=a.reduce((x,y)=>x+y,0)/6;const lo=a.map((v,i)=>[v,i]).sort((x,y)=>x[0]-y[0])[0][1];
   return {main:m.toFixed(1),max:5,label:"Positive university score (1–5)",
    text:"Your lowest-rated feature: "+N[lo]+". Think of one change that would improve it.",
    detail:"Based on common features of good schools in the textbook: a safe environment, a shared vision, explicit goals, attention to the individual student, rewarding effort and improvement, and belonging."}}},
 work10:{day:102,chap:"Chapter 10 · Part 2",kind:"Poll",title:"What would make you thrive at work?",sub:"Positive organisations · two questions",type:"poll",items:[
   {q:"Which ONE workplace practice would most increase your engagement?",o:["A manager who listens and uses my strengths","Flexible working (choice of time or place)","Variety: trying new tasks","Clear goals and regular feedback","A strong, friendly team","Training and development"],
    after:"All six are practices of positive organisations. Many link back to the three needs: autonomy, competence and relatedness."},
   {q:"Think of the best manager or teacher you have had. What did they do most?",o:["Recognised my effort","Gave me freedom to decide","Helped me grow","Cared about me as a person","Set clear expectations"],
    after:"Managers matter a lot: employees who feel ignored by their manager are far more likely to disengage."}]},
 quiz10b:{day:102,chap:"Chapter 10 · Part 2",kind:"Quiz",title:"Part 2 exit quiz",sub:"6 scenarios · instant feedback",type:"quiz",
  items:[
   {q:"Which factor did reviews find matters MORE for therapy success than the specific technique?",o:["The price of therapy","The relationship and common factors such as empathy","The colour of the room","The number of tests used"],a:1,why:"Common factors such as warmth, empathy and the therapeutic relationship explained more of therapy success than the technique."},
   {q:"Talal is doing fine but wants to become a better team leader. Which service fits best?",o:["Psychiatric treatment","Coaching","Hospital care","No help is possible"],a:1,why:"Coaching is for non-clinical people who want to grow and perform better."},
   {q:"A school wants to raise well-being. According to the research, what is most likely to work?",o:["One assembly talk","A whole-school approach involving all staff and students","Only testing students more","Only a poster campaign"],a:1,why:"School-wide programmes are more effective than class-only interventions, partly because staff model positive behaviour."},
   {q:"Saud’s manager ignores him. What is the likely effect?",o:["More engagement","Much higher risk that he disengages","No effect","He will get promoted"],a:1,why:"Employees who feel ignored by their manager are far more likely to disengage; managers who use strengths cut that risk."},
   {q:"A large UK trial taught mindfulness to about 8,000 students. What did it find?",o:["It worked better than usual teaching for mental health","It was no better than usual social-emotional teaching","It harmed students","It doubled grades"],a:1,why:"School mindfulness training was not better than usual teaching. Good intentions still need evidence."},
   {q:"Why do some governments now measure citizens’ well-being, not just GDP?",o:["Because GDP is always wrong","Because money measures miss much of what makes life worth living","To replace elections","Because it is cheaper"],a:1,why:"Well-being measures help governments see which policies actually improve people’s lives."}]}
};

const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// ---- live class results: each answer is also sent, anonymously, to the instructor's Google Sheet ----
const LIVE="https://script.google.com/macros/s/AKfycbxHhtaASTQQY8flOhLDtkRgiM0M3z_XO7CO7q6D3TXkMo_-Z2NQeggMcJqkH55vb_-F7A/exec";
function sid(){let x=store.get('sid');if(!x){x=Math.random().toString(36).slice(2,12);store.set('sid',x)}return x}
function send(k,i,j){if(!LIVE)return;try{fetch(LIVE,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a:k,q:i,o:j,s:sid()})}).catch(()=>{})}catch(e){}}
let liveTick=null;
function liveView(k,v){
  document.body.classList.add('live');
  const isQuiz=v.type==='quiz',N=v.items.length,join=location.origin+location.pathname+'#'+k;
  let cur=0,reveal=false,data={n:0,q:{}};
  const WIN=90*60*1000,since=()=>Math.max(store.get('since_'+k)||0,Date.now()-WIN);
  app.innerHTML=`<button class="back" data-go="">← All activities</button>
   <div class="lv-top"><div><p class="eyebrow">${esc(v.chap||'')} · Live class results</p><h2>${esc(v.title)}</h2>
     <div class="lv-bar"><span class="lv-count" id="lvn">0</span><span>responses<br><span class="lv-live"><i></i>updating live · answers from the last 90 minutes</span></span></div></div>
     <div class="lv-join"><div id="lvqr"></div><div><b>Scan to join</b><p>${esc(join.replace(/^https?:\/\//,''))}</p><p>No sign-in · anonymous</p></div></div></div>
   <div class="card" id="lvcard"></div>
   <div class="lv-bar">${N>1?`<div class="lv-dots">${v.items.map((_,i)=>`<button data-q="${i}">Q${i+1}</button>`).join('')}</div>`:''}
     ${isQuiz?'<button id="lvrev">Show correct answer</button>':''}<button id="lvnew" title="Count only answers from now on (for back-to-back classes)">New class session</button></div>
   ${isQuiz?'<div class="lv-sum" id="lvsum"></div>':''}
   ${LIVE?'':'<p class="note">Live results are not connected yet.</p>'}`;
  try{new QRCode(document.getElementById('lvqr'),{text:join,width:132,height:132,colorDark:'#0F3D3E',colorLight:'#ffffff'})}catch(e){}
  const draw=()=>{
    document.getElementById('lvn').textContent=data.n||0;
    const it=v.items[cur],c=(data.q&&data.q[cur])||{},tot=Object.values(c).reduce((a,b)=>a+b,0);
    document.getElementById('lvcard').innerHTML=`<p class="progress">${N>1?`Question ${cur+1} of ${N} · `:''}${tot} answered</p><p class="lv-q">${esc(it.q)}</p>`+
      it.o.map((o,j)=>{const n=c[j]||0,p=tot?Math.round(n*100/tot):0,cls=isQuiz&&reveal?(j===it.a?' ok':' dim'):'';
        return `<div class="lv-row${cls}"><span class="lv-lab">${isQuiz?String.fromCharCode(65+j)+'. ':''}${esc(o)}</span><div class="lv-track"><div class="lv-fill" style="width:${p}%"></div></div><span class="lv-n">${p}%<small>${n}</small></span></div>`}).join('')+
      (isQuiz&&reveal?`<p class="fb">${esc(it.why)}</p>`:'');
    app.querySelectorAll('.lv-dots button').forEach(b=>b.classList.toggle('on',+b.dataset.q===cur));
    if(isQuiz){document.getElementById('lvsum').innerHTML=v.items.map((q,i)=>{const cc=(data.q&&data.q[i])||{},t=Object.values(cc).reduce((a,b)=>a+b,0);
      return `<div><b>${t?Math.round((cc[q.a]||0)*100/t):0}%</b>Q${i+1} correct</div>`}).join('');
      document.getElementById('lvrev').textContent=reveal?'Hide answer':'Show correct answer';}
  };
  const pull=()=>{if(!LIVE)return draw();fetch(LIVE+'?a='+encodeURIComponent(k)+'&since='+since()+'&t='+Date.now()).then(r=>r.json()).then(d=>{data=d;draw()}).catch(()=>{})};
  app.querySelectorAll('.lv-dots button').forEach(b=>b.onclick=()=>{cur=+b.dataset.q;reveal=false;draw()});
  if(isQuiz)document.getElementById('lvrev').onclick=()=>{reveal=!reveal;draw()};
  document.getElementById('lvnew').onclick=()=>{if(confirmNew()){store.set('since_'+k,Date.now());data={n:0,q:{}};draw();pull()}};
  draw();pull();liveTick=setInterval(pull,3000);
}
function confirmNew(){const b=document.getElementById('lvnew');if(b.dataset.arm){delete b.dataset.arm;b.textContent='New class session';return true}
  b.dataset.arm=1;b.textContent='Click again to clear the screen';setTimeout(()=>{if(b.dataset.arm){delete b.dataset.arm;b.textContent='New class session'}},4000);return false}

function home(){
  const day=n=>Object.entries(DATA).filter(([k,v])=>k!=='home'&&v.day===n).map(([k,v])=>
    `<a class="tile" href="#${k}" data-go="${k}"><span class="k">${v.kind}</span><span><b>${esc(v.title)}</b><span class="s">${esc(v.sub)}</span></span></a>`).join('');
  app.innerHTML=`<div><p class="eyebrow">PSY385 Positive Psychology · AUM</p><h1>Class Activities</h1></div>
  <p class="muted">Scan the QR code on the slide, or pick the activity your instructor names. Nothing you enter leaves your phone.</p>
  <p class="eyebrow" style="margin-top:8px">Getting started</p>
  <section class="day"><h3>Course introduction</h3>${day(10)}</section>
  <p class="eyebrow" style="margin-top:8px">Chapter 1 · Introduction to Positive Psychology</p>
  <section class="day"><h3>One session · From what is wrong to what is strong</h3>${day(11)}</section>
  <p class="eyebrow" style="margin-top:8px">Chapter 2 · Understanding Emotions</p>
  <section class="day"><h3>Part 1 · Positive emotions</h3>${day(21)}</section>
  <section class="day"><h3>Part 2 · Sources of emotion and emotional intelligence</h3>${day(22)}</section>
  <p class="eyebrow" style="margin-top:8px">Chapter 4 · Eudaimonic Wellbeing</p>
  <section class="day"><h3>Part 2 · Flow, meaning and life’s big questions</h3>${day(0)}</section>
  <p class="eyebrow" style="margin-top:8px">Chapter 5 · Optimism, Explanatory Style and Hope</p>
  <section class="day"><h3>Part 1 · Optimism and explanatory style</h3>${day(1)}</section>
  <section class="day"><h3>Part 2 · Control, the three selves and hope</h3>${day(2)}</section>
  <p class="eyebrow" style="margin-top:8px">Chapter 6 · Resilience, Post-Traumatic Growth and Positive Ageing</p>
  <section class="day"><h3>One session · Resilience, coping, growth and ageing</h3>${day(6)}</section>
  <p class="eyebrow" style="margin-top:8px">Chapter 7 · Values, Motivation and Goal Theories</p>
  <section class="day"><h3>Part 1 · Goals and motivation</h3>${day(71)}</section>
  <section class="day"><h3>Part 2 · Values and time</h3>${day(72)}</section>
  <p class="eyebrow" style="margin-top:8px">Chapter 8 · Positive Psychological Interventions</p>
  <section class="day"><h3>One session · Mindsets, grit, change and positive activities</h3>${day(8)}</section>
  <p class="eyebrow" style="margin-top:8px">Chapter 9 · Physical Activity and Positive Psychology</p>
  <section class="day"><h3>One session · The body, movement and well-being</h3>${day(9)}</section>
  <p class="eyebrow" style="margin-top:8px">Chapter 10 · Applying Positive Psychology</p>
  <section class="day"><h3>Part 1 · Character strengths</h3>${day(101)}</section>
  <section class="day"><h3>Part 2 · Therapy, coaching, education and work</h3>${day(102)}</section>`;
}
function header(v){return `<button class="back" data-go="">← All activities</button><div><p class="eyebrow">${v.chap?v.chap:v.day===6?"Chapter 6":v.day?"Chapter 5 · Part "+v.day:"Chapter 4"} · ${v.kind}</p><h2>${esc(v.title)}</h2></div>${v.intro?`<p class="muted">${esc(v.intro)}</p>`:''}`}

function poll(k,v){
  const saved=store.get('p_'+k)||{};
  app.innerHTML=header(v)+v.items.map((it,i)=>`<div class="card"><p class="q">${esc(it.q)}</p><div class="opts">${it.o.map((o,j)=>
    `<button class="opt" data-i="${i}" data-j="${j}" aria-pressed="${saved[i]===j}">${esc(o)}</button>`).join('')}</div>
    <p class="fb" id="pf${i}" ${saved[i]===undefined?'hidden':''}>${esc(it.after)}</p></div>`).join('')+
    `<p class="note">${LIVE?"Your answer is added anonymously to the class results on screen. You can change it.":"Your instructor will ask for a show of hands, so remember your answer."}</p>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,j=+b.dataset.j;saved[i]=j;store.set('p_'+k,saved);send(k,i,j);
    app.querySelectorAll(`.opt[data-i="${i}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));document.getElementById('pf'+i).hidden=false;});
}
function quiz(k,v){
  let right=0,done=0;
  app.innerHTML=header(v)+v.items.map((it,i)=>`<div class="card"><p class="progress">Question ${i+1} of ${v.items.length}</p><p class="q">${esc(it.q)}</p><div class="opts">${it.o.map((o,j)=>
   `<button class="opt" data-i="${i}" data-j="${j}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}</div><p class="fb" id="qf${i}" hidden></p></div>`).join('')+
   `<div class="result" id="qres" hidden></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,j=+b.dataset.j,it=v.items[i];
    const group=app.querySelectorAll(`.opt[data-i="${i}"]`);if(group[0].disabled)return;
    group.forEach((x,n)=>{x.disabled=true;if(n===it.a)x.classList.add('right');});send(k,i,j);
    if(j!==it.a)b.classList.add('wrong');else right++;done++;
    const f=document.getElementById('qf'+i);f.hidden=false;f.textContent=(j===it.a?'Correct. ':'Not quite. ')+it.why;
    if(done===v.items.length){const r=document.getElementById('qres');r.hidden=false;
      r.innerHTML=`<p class="eyebrow">Your score</p><p class="big">${right} / ${v.items.length}</p><p>Review any question you missed, then show your instructor your score.</p>`;}
  });
}
function scale(k,v){
  const ans=new Array(v.items.length).fill(null);
  const cols=v.values.length;
  app.innerHTML=header(v)+`<div class="card"><p class="note">${v.values.map((n,i)=>`${n} = ${esc(v.labels[i])}`).join(' · ')}</p></div>`+
   v.items.map((it,i)=>`<div class="card"><p class="q">${i+1}. ${esc(it)}</p><div class="scale" style="grid-template-columns:repeat(${cols},1fr)">${v.values.map(n=>
   `<button data-i="${i}" data-n="${n}" aria-pressed="false" aria-label="${esc(v.labels[v.values.indexOf(n)])}">${n}</button>`).join('')}</div>
   <div class="legend"><span>${esc(v.labels[0])}</span><span>${esc(v.labels[cols-1])}</span></div></div>`).join('')+
   `<p class="progress" id="prog">0 of ${v.items.length} answered</p><button class="primary" id="go" disabled>See my score</button><div class="result" id="res" hidden></div>`;
  const go=document.getElementById('go');
  app.querySelectorAll('.scale button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;ans[i]=+b.dataset.n;
    app.querySelectorAll(`.scale button[data-i="${i}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));
    const c=ans.filter(x=>x!==null).length;document.getElementById('prog').textContent=`${c} of ${v.items.length} answered`;go.disabled=c<v.items.length;});
  go.onclick=()=>{const s=v.score(ans),r=document.getElementById('res');r.hidden=false;
    r.innerHTML=`<p class="eyebrow">${esc(s.label)}</p><p class="big">${s.main}</p><div class="bar"><i style="width:${Math.round(s.main/s.max*100)}%"></i></div><p>${esc(s.text)}</p><p class="note">${esc(s.detail)}</p><p class="note">This is a learning exercise, not a diagnosis. Your answers are not sent anywhere.</p>`;
    r.scrollIntoView({behavior:'smooth',block:'start'});};
}
function abc(k,v){
  const d=store.get('abc')||{};
  const F=[["a","A · Adversity","Just the facts: who, what, when, where. Example: “I got 11/20 on my Statics quiz.”"],
    ["b","B · Belief","Your first automatic thought about why it happened and what will happen next."],
    ["c","C · Consequence","How did that belief make you feel and act?"],
    ["d","D · Disputation","Argue with the belief like a fair friend. Is it permanent? Does it affect everything? Is it all your fault? What is the evidence?"],
    ["e","E · Energisation","How do you feel and what will you do now, after disputing?"]];
  app.innerHTML=header(v)+`<p class="muted">Seligman’s ABC model (textbook p. 98), with the D and E steps used in learned-optimism training. Think of one recent setback at university.</p>`+
   F.map(([id,l,h])=>`<div class="card"><label class="f" for="abc_${id}">${l}<small>${h}</small><textarea id="abc_${id}">${esc(d[id]||'')}</textarea></label></div>`).join('')+
   `<p class="note">Saved on this phone only. Your instructor may ask volunteers to share their D step.</p>`;
  F.forEach(([id])=>{const t=document.getElementById('abc_'+id);t.oninput=()=>{d[id]=t.value;store.set('abc',d)}});
}
let tick=null;
function bps(k,v){
  const d=store.get('bps')||'';
  app.innerHTML=header(v)+`<div class="card"><p>Imagine your life ten years from now. Everything has gone as well as it possibly could. You worked hard and reached your goals. Write about what you see: your work, your family, your health, your community.</p>
   <p class="muted">Then list one or two small steps you could take this month toward that future (Sheldon & Lyubomirsky, 2006; textbook p. 110).</p></div>
   <div class="card"><div class="row"><span class="timer" id="tm">5:00</span><button class="primary" id="tst">Start 5-minute timer</button><button class="ghost" id="trs">Reset</button></div>
   <label class="f" for="bpsText">My best possible self<textarea id="bpsText" style="min-height:220px">${esc(d)}</textarea></label></div>
   <p class="note">Saved on this phone only. For the full exercise, repeat it for 20 minutes on three days in a row.</p>`;
  const tm=document.getElementById('tm');let left=300;
  const show=()=>tm.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
  document.getElementById('tst').onclick=()=>{if(tick)return;tick=setInterval(()=>{left=Math.max(0,left-1);show();if(!left){clearInterval(tick);tick=null;tm.textContent="Time!";}},1000)};
  document.getElementById('trs').onclick=()=>{clearInterval(tick);tick=null;left=300;show()};
  const t=document.getElementById('bpsText');t.oninput=()=>store.set('bps',t.value);
}
function route(){
  if(tick){clearInterval(tick);tick=null}
  if(liveTick){clearInterval(liveTick);liveTick=null}document.body.classList.remove('live');
  const k=(location.hash||'').slice(1);const v=DATA[k];
  if(k.startsWith('live-')&&DATA[k.slice(5)]){liveView(k.slice(5),DATA[k.slice(5)]);}
  else if(!v||k==='home'){home();}
  else ({poll,quiz,scale,abc,bps})[v.type](k,v);
  app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();const g=b.dataset.go;
    try{history.replaceState(null,'',g?'#'+g:location.pathname)}catch(x){} show(g)}));
  window.scrollTo(0,0);
}
function show(g){const v=DATA[g];if(tick){clearInterval(tick);tick=null}if(liveTick){clearInterval(liveTick);liveTick=null}document.body.classList.remove('live');
  if(!v||g==='home')home();else ({poll,quiz,scale,abc,bps})[v.type](g,v);
  app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();const n=b.dataset.go;try{history.replaceState(null,'',n?'#'+n:location.pathname)}catch(x){} show(n)}));
  window.scrollTo(0,0);}
window.addEventListener('hashchange',route);
route();
</script>
