<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PSY385 Class Activities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow phone-first column; a home list of activities, each activity is its own view opened by #token */
:root{
  --bg:#F3F8F7; --surface:#FFFFFF; --ink:#13302F; --muted:#4F6B69; --line:#D3E3E0;
  --teal:#0D7F75; --teal-soft:#E1F3F0; --amber:#B86E00; --amber-soft:#FFF1D6; --good:#17803D; --bad:#B42318;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A1A; --surface:#152626; --ink:#E6F2F0; --muted:#9DB8B4; --line:#2A4442;
  --teal:#3CC5B6; --teal-soft:#183A37; --amber:#F5B547; --amber-soft:#3A2E14; --good:#4ACB7A; --bad:#F2746B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A1A; --surface:#152626; --ink:#E6F2F0; --muted:#9DB8B4; --line:#2A4442;
  --teal:#3CC5B6; --teal-soft:#183A37; --amber:#F5B547; --amber-soft:#3A2E14; --good:#4ACB7A; --bad:#F2746B; color-scheme:dark}
html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.9rem} h2{font-size:1.45rem}
p{margin:0}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--teal)}
.muted{color:var(--muted)}
.day{display:flex;flex-direction:column;gap:10px}
.day h3{margin:6px 0 0;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
a.tile{display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none}
a.tile:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
a.tile .k{flex:0 0 auto;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--teal-soft);color:var(--teal);width:118px;box-sizing:border-box;text-align:center}
a.tile b{display:block} a.tile span.s{font-size:.9rem;color:var(--muted)}
.back{align-self:flex-start;background:none;border:0;color:var(--teal);font:600 1rem var(--body);padding:4px 0;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.q{font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:500 1rem var(--body);cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.fb{padding:10px 12px;border-radius:10px;background:var(--amber-soft);font-size:.95rem}
.scale{display:grid;gap:6px}
.scale button{padding:10px 0;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:600 1rem var(--body);cursor:pointer;font-variant-numeric:tabular-nums}
.scale button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.legend{font-size:.82rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.primary{align-self:flex-start;padding:12px 18px;border-radius:10px;border:0;background:var(--teal);color:var(--surface);font:700 1rem var(--body);cursor:pointer}
.primary:disabled{opacity:.45;cursor:not-allowed}
.result{background:var(--teal-soft);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.big{font-family:var(--display);font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
textarea{width:100%;box-sizing:border-box;min-height:84px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:1rem/1.45 var(--body);resize:vertical}
label.f{font-weight:600;display:flex;flex-direction:column;gap:6px}
label.f small{font-weight:400;color:var(--muted)}
.timer{font-family:var(--display);font-size:2.2rem;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ghost{padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:none;color:var(--ink);font:600 .95rem var(--body);cursor:pointer}
.note{font-size:.85rem;color:var(--muted)}
.progress{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.opt,.scale button{transition:background .15s,border-color .15s}}

/* ---- live class results (projector view) ---- */
body.live .wrap{max-width:1180px}
body.live{font-size:20px}
.lv-top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;flex-wrap:wrap}
.lv-join{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.lv-join img,.lv-join canvas{width:132px;height:132px}
.lv-join p{margin:0;font-size:15px;color:var(--muted)}.lv-join b{display:block;font-size:17px;color:var(--ink)}
.lv-count{font-family:var(--display);font-size:56px;line-height:1;color:var(--teal);font-weight:700}
.lv-q{font-family:var(--display);font-size:26px;line-height:1.25;margin:2px 0 10px}
.lv-row{display:grid;grid-template-columns:minmax(180px,34%) 1fr 92px;gap:14px;align-items:center;margin:4px 0}
.lv-lab{font-weight:600;font-size:18px;line-height:1.25}
.lv-track{height:32px;border-radius:10px;background:var(--teal-soft);overflow:hidden}
.lv-fill{height:100%;width:0;border-radius:10px;background:var(--teal);transition:width .6s ease}
.lv-row.ok .lv-fill{background:var(--good)}.lv-row.ok .lv-lab::after{content:"  ✓";color:var(--good)}
.lv-row.dim .lv-fill{background:var(--line)}
.lv-n{font-variant-numeric:tabular-nums;text-align:right;font-weight:700;font-size:22px}.lv-n small{display:inline;margin-left:6px;font-weight:400;font-size:14px;color:var(--muted)}
.lv-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lv-bar button{font:inherit;font-size:16px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.lv-bar button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.lv-dots{display:flex;gap:8px;flex-wrap:wrap}.lv-dots button{min-width:56px}
.lv-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.lv-sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.lv-sum b{display:block;font-size:26px;color:var(--teal)}
.lv-live{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.lv-live i{width:10px;height:10px;border-radius:50%;background:var(--good);animation:lvp 1.6s infinite}
@keyframes lvp{0%,100%{opacity:1}50%{opacity:.25}}
@media (max-width:700px){.lv-row{grid-template-columns:1fr 70px}.lv-track{grid-column:1/-1;order:3}.lv-q{font-size:24px}}
</style>

</head>

<script>
const DATA = {
 home:{},
 // ---------------- INTRODUCTION ----------------
 hello:{day:10,chap:"Course introduction",kind:"Poll",title:"Warm-up: why this course?",sub:"Two quick questions",type:"poll",items:[
   {q:"Why did you choose PSY385 Positive Psychology?",o:["The topic sounds interesting","I want to feel happier or less stressed","It may help my future career","A friend recommended it","It fitted my schedule"],
    after:"The textbook opens with this same question. Whatever brought you here, every chapter links the research to your own life."},
   {q:"Which question would you most like this course to answer?",o:["What makes people truly happy?","How can I handle stress and setbacks?","How do I find my strengths?","How do I stay motivated?","How can I build better relationships?"],
    after:"All five are covered: happiness (Ch. 3–4), resilience (Ch. 6), strengths (Ch. 10), motivation (Ch. 7) and relationships throughout."}]},
 // ---------------- CHAPTER 1 ----------------
 why1:{day:11,chap:"Chapter 1",kind:"Poll",title:"Warm-up: what is psychology about?",sub:"Two quick questions",type:"poll",items:[
   {q:"When you hear the word “psychology”, what do you think of first?",o:["Mental illness and therapy","How the brain works","Understanding behaviour and personality","Happiness and wellbeing","Reading people’s minds"],
    after:"For most of the 20th century, psychology focused mainly on mental illness. Positive psychology adds the study of what goes right."},
   {q:"Is a person with no mental illness automatically mentally healthy?",o:["Yes","No","Not sure"],
    after:"No. Research shows mental health and mental illness are two separate continua: you can be free of illness and still be languishing."}]},
 flour1:{day:11,chap:"Chapter 1",kind:"Questionnaire",title:"The Flourishing Scale",sub:"8 items · 2 minutes · Diener et al. (2010)",type:"scale",
  intro:"How much do you agree with each statement? Your answers stay on your phone.",
  labels:["Strongly disagree","Disagree","Slightly disagree","Neither","Slightly agree","Agree","Strongly agree"],values:[1,2,3,4,5,6,7],
  items:["I lead a purposeful and meaningful life.","My social relationships are supportive and rewarding.","I am engaged and interested in my daily activities.","I actively contribute to the happiness and wellbeing of others.","I am competent and capable in the activities that are important to me.","I am a good person and live a good life.","I am optimistic about my future.","People respect me."],
  score(a){const t=a.reduce((x,y)=>x+y,0);const lo=a.map((v,i)=>[v,i]).sort((x,y)=>x[0]-y[0])[0][1];
   const L=["meaning and purpose","supportive relationships","engagement","contributing to others","competence","being a good person","optimism","feeling respected"];
   const v=t>=48?"You describe yourself as flourishing in most areas of life.":t>=40?"You are doing well in many areas, with room to grow in some.":t>=32?"Some areas of your life feel strong and others less so.":"Several areas feel difficult right now. Talking to someone you trust, or to a university counsellor, can help.";
   return {main:t,max:56,label:"Flourishing score (8–56)",text:v+" Your lowest item was "+L[lo]+": a good place to start.",
    detail:"Add the eight answers (1–7 each). Higher scores mean more psychological resources and strengths. There are no official cut-offs; the bands here are only a guide. Source: Diener et al. (2010)."}}},
 model1:{day:11,chap:"Chapter 1",kind:"Quick check",title:"Which psychology is it?",sub:"Disease model or positive psychology · 5 scenarios",type:"quiz",intro:"Is each example closer to ‘psychology as usual’ (fixing what is wrong) or positive psychology (building what is right)?",
  items:[
   {q:"A study asks why some students fail their first year at university.",o:["Psychology as usual","Positive psychology"],a:0,why:"‘Why do people fail?’ is the classic deficit question."},
   {q:"A study asks what helps some students thrive in their first year, even under pressure.",o:["Psychology as usual","Positive psychology"],a:1,why:"‘What makes people succeed?’ is the positive psychology question."},
   {q:"A clinic helps Yousef move from severe to mild depression.",o:["Psychology as usual","Positive psychology"],a:0,why:"Moving from −8 towards 0 is the disease (medical) model. It is important work, but only half the picture."},
   {q:"A workshop helps Faisal, who is not ill but feels ‘flat’, find more energy and meaning.",o:["Psychology as usual","Positive psychology"],a:1,why:"Moving someone from languishing towards flourishing (0 to +8) is the focus of positive psychology."},
   {q:"Researchers test whether daily gratitude letters raise wellbeing in a randomised trial.",o:["Psychology as usual","Positive psychology"],a:1,why:"Positive psychology studies wellbeing with the scientific method. It is not self-help."}]},
 quiz1c:{day:11,chap:"Chapter 1",kind:"Quiz",title:"Chapter 1 exit quiz",sub:"6 scenarios · instant feedback",type:"quiz",
  items:[
   {q:"Hamad says positive psychology is just ‘think positive and smile’. What is the best reply?",o:["He is right","It is the scientific study of what helps people and communities thrive","It only studies happy people","It replaces therapy"],a:1,why:"Positive psychology uses research to study wellbeing, strengths and flourishing, not slogans."},
   {q:"Talal has no mental illness but feels empty and unmotivated. Keyes would describe him as…",o:["Flourishing","Languishing","Mentally ill","Perfectly healthy"],a:1,why:"Mental health and mental illness are separate continua. No illness does not mean flourishing."},
   {q:"A researcher studies kindness and teamwork in a company. Which ‘node’ of positive psychology is this?",o:["Subjective node","Individual node","Group node","Future node"],a:2,why:"The group node studies positive institutions and communities, such as altruism and work ethic."},
   {q:"Bader is absorbed in coding for hours and loses track of time. Which of Seligman’s ‘lives’ is this?",o:["The pleasant life","The engaged life","The meaningful life","The comfortable life"],a:1,why:"Flow and absorption belong to the engaged life."},
   {q:"Which group was studying ‘the good life’ long before positive psychology?",o:["Only modern economists","Aristotle, the utilitarians, William James and the humanistic psychologists","Nobody before 1998","Only medical doctors"],a:1,why:"The textbook names four historical roots: the Greeks, utilitarianism, William James and humanistic psychology."},
   {q:"What is the main criticism humanistic psychologists make of positive psychology?",o:["It is too qualitative","It separated itself and relied almost only on numbers (quantitative methods)","It ignores happiness","It has no research"],a:1,why:"Humanists argue positive psychology left out qualitative methods and their ‘cousins’ in its push to look scientific."}]},
 // ---------------- CHAPTER 2 · PART 1 ----------------
 emo2:{day:21,chap:"Chapter 2 · Part 1",kind:"Poll",title:"Warm-up: your emotions this week",sub:"Two quick questions",type:"poll",items:[
   {q:"Which positive emotion did you feel MOST this week?",o:["Joy","Gratitude","Serenity (calm)","Interest","Hope","Pride","Amusement","Love"],
    after:"These are from Fredrickson’s ‘top ten’ positive emotions. Today we see what they do for us."},
   {q:"When you feel really good, what usually happens to your thinking?",o:["I get more creative and open","I focus on one thing","I get lazy","Nothing changes"],
    after:"Broaden-and-build theory predicts the first answer: positive emotions widen attention and thinking."}]},
 spane2:{day:21,chap:"Chapter 2 · Part 1",kind:"Questionnaire",title:"SPANE: positive and negative experience",sub:"12 feelings · 2 minutes · Diener et al. (2009)",type:"scale",
  intro:"Think about the past four weeks. How often did you feel each of the following? Your answers stay on your phone.",
  labels:["Very rarely or never","Rarely","Sometimes","Often","Very often or always"],values:[1,2,3,4,5],
  items:["Positive","Negative","Good","Bad","Pleasant","Unpleasant","Happy","Sad","Afraid","Joyful","Angry","Contented"],
  score(a){const P=a[0]+a[2]+a[4]+a[6]+a[9]+a[11],N=a[1]+a[3]+a[5]+a[7]+a[8]+a[10],B=P-N;
   const v=B>=10?"Positive feelings clearly outweigh negative ones for you this month.":B>0?"You felt somewhat more positive than negative this month.":B===0?"Your positive and negative feelings were balanced this month.":"Negative feelings outweighed positive ones this month. Notice what might help, and talk to someone you trust if it continues.";
   return {main:(B>0?"+":"")+B,max:24,label:"Affect balance (SPANE-B, −24 to +24)",text:`Positive (SPANE-P): ${P} of 30 · Negative (SPANE-N): ${N} of 30. ${v}`,
    detail:"SPANE-P adds positive, good, pleasant, happy, joyful and contented. SPANE-N adds negative, bad, unpleasant, sad, afraid and angry. Balance = P minus N. Source: Diener et al. (2009)."}}},
 em2:{day:21,chap:"Chapter 2 · Part 1",kind:"Quick check",title:"Emotion, mood or broaden-and-build?",sub:"5 everyday scenarios",type:"quiz",intro:"Read each scenario and pick the best answer.",
  items:[
   {q:"Omar has felt vaguely low all week but cannot say why.",o:["Emotion","Mood"],a:1,why:"No clear trigger and long-lasting: a mood."},
   {q:"Yousef’s heart races when his name is called to present.",o:["Emotion","Mood"],a:0,why:"A clear trigger and a brief burst of arousal: an emotion."},
   {q:"After a funny video, Khaled finds three new ideas for his group project.",o:["Broadening","Building","Undoing","Narrowing"],a:0,why:"Positive emotion widened his thinking in the moment: broadening."},
   {q:"After a stressful exam, Fahad laughs with friends and his heart rate calms down faster.",o:["Broadening","Building","Undoing","Narrowing"],a:2,why:"Positive emotions help the body recover from stress faster: the undoing effect."},
   {q:"Over a semester of weekly football with classmates, Saud gains close friends he can rely on.",o:["Broadening","Building","Undoing","Narrowing"],a:1,why:"Repeated positive emotions build lasting resources, such as social support."}]},
 quiz2a:{day:21,chap:"Chapter 2 · Part 1",kind:"Quiz",title:"Part 1 exit quiz",sub:"6 scenarios · instant feedback",type:"quiz",
  items:[
   {q:"Why does a single rude comment often stay with Nasser longer than five compliments?",o:["He is too sensitive","The negativity bias: bad is stronger than good","Compliments are not real","Moods last longer than emotions"],a:1,why:"Our ancestors survived by noticing threats, so negative events tend to hit harder."},
   {q:"Ali’s coach says, “You must stay positive 100% of the time.” What does newer research suggest?",o:["The coach is right","Accepting negative emotions, not forcing positivity, predicts better wellbeing","Negative emotions should be hidden","Positivity has no benefits"],a:1,why:"Forced cheerfulness can backfire; accepting difficult emotions is linked to better mental health."},
   {q:"What happened to the famous 3:1 positivity ratio?",o:["It was proven exactly","Its mathematical model was withdrawn; ‘more positive than negative’ still helps","It became 10:1","It only applies to companies"],a:1,why:"The maths was shown to be invalid in 2013. There is no magic number, but positivity still matters."},
   {q:"Talal feels a rush of vastness looking at the desert sky at night. Which emotion is this?",o:["Pride","Awe","Amusement","Serenity"],a:1,why:"Awe is the feeling of being in the presence of something vast that we cannot fully grasp."},
   {q:"Which statement about ‘basic emotions’ fits newer research best?",o:["There are exactly six emotions","There may be many more than six, and the brain builds emotions from body and context","Emotions have nothing to do with the body","Only negative emotions are basic"],a:1,why:"Studies now map 27 or more kinds of emotion, and constructionist views see emotions as built by the brain."},
   {q:"Mubarak wants to grow his positive emotions this week. Which plan fits the research?",o:["Wait for something good to happen","Notice one top-ten emotion daily and what triggers it","Avoid all negative feelings","Watch more short videos"],a:1,why:"Fredrickson’s positivity portfolio asks people to notice and deliberately cultivate their positive emotions."}]},
 // ---------------- CHAPTER 2 · PART 2 ----------------
 meter2:{day:22,chap:"Chapter 2 · Part 2",kind:"Poll",title:"Mood Meter check-in",sub:"Two quick questions",type:"poll",items:[
   {q:"Right now, which box are you in?",o:["High energy · unpleasant (stressed, anxious)","High energy · pleasant (excited, proud)","Low energy · unpleasant (tired, bored)","Low energy · pleasant (calm, content)"],
    after:"The two dimensions are pleasantness and energy: the circumplex model of affect (Russell, 1980)."},
   {q:"Which word describes your feeling most precisely?",o:["Fine / OK","Tired","Stressed","Bored","Curious","Calm","Excited","Grateful"],
    after:"“Fine” tells us little. Naming feelings precisely (emotional granularity) helps people manage them better."}]},
 ei2:{day:22,chap:"Chapter 2 · Part 2",kind:"Quick check",title:"EI in action: which branch?",sub:"The four-branch ability model · 5 scenarios",type:"quiz",intro:"Which branch of emotional intelligence is each student using?",
  items:[
   {q:"Nasser notices that Bader has gone quiet in their design meeting.",o:["Perceiving","Using","Understanding","Managing"],a:0,why:"Noticing how others feel is perceiving emotion."},
   {q:"Talal plays upbeat music before brainstorming, then calms down to check the budget.",o:["Perceiving","Using","Understanding","Managing"],a:1,why:"Choosing a mood that helps the task is using emotion to think."},

   {q:"Mohammad waits until after class to raise an unfair comment calmly.",o:["Perceiving","Using","Understanding","Managing"],a:3,why:"Regulating when and how to express a feeling is managing emotion."},
   {q:"Which EI model uses tests with right and wrong answers?",o:["Ability model","Mixed model","Trait model","Big Five"],a:0,why:"The ability model (Mayer, Salovey and Caruso) uses performance tests such as the MSCEIT 2."}]},
 ai2:{day:22,chap:"Chapter 2 · Part 2",kind:"Poll",title:"Debate: can AI have emotional intelligence?",sub:"One statement, two questions",type:"poll",items:[
   {q:"“If an AI scores higher than humans on an EI test, it is emotionally intelligent.”",o:["Strongly agree","Agree","Not sure","Disagree","Strongly disagree"],
    after:"In 2025, six AI chatbots averaged 81% on EI tests, against 56% for humans. Knowing the right answer is not the same as feeling or managing emotions."},
   {q:"Would you ask an AI chatbot for advice about a personal problem?",o:["Yes, often","Sometimes","Only for small things","Never"],
    after:"Think about what AI can and cannot know about you, your family and your context."}]},
 quiz2b:{day:22,chap:"Chapter 2 · Part 2",kind:"Quiz",title:"Part 2 exit quiz",sub:"6 scenarios · instant feedback",type:"quiz",
  items:[
   {q:"Abdullah and Hamad both score 75 on the midterm. Abdullah got 55 on the quiz; Hamad got 92. Who probably feels better?",o:["Hamad","Abdullah","Both the same","Neither"],a:1,why:"We feel good when progress is faster than expected. The rate of progress matters most."},
   {q:"Khaled says, “Dopamine is the pleasure chemical.” What is more accurate?",o:["He is right","Dopamine is mainly about wanting and motivation","Dopamine causes fear","Dopamine stores memories"],a:1,why:"Dopamine drives wanting; pleasure itself relies on small opioid ‘hotspots’."},
   {q:"Which kind of positive feeling protects most against depression, anxiety and stress?",o:["Excited and activated","Safe and content","Proud","Amused"],a:1,why:"Feeling safe, warm and connected was the strongest protector."},
   {q:"Yaqoub scores high on a self-report EI questionnaire. What is the main caution?",o:["Self-report EI overlaps with personality and can be faked","It proves he is a genius","Self-reports are always accurate","EI cannot be measured at all"],a:0,why:"Trait (self-report) EI overlaps strongly with the Big Five and is open to faking good."},
   {q:"How strongly does EI predict academic performance?",o:["Not at all","Modestly, even beyond IQ and personality","More than IQ does","Perfectly"],a:1,why:"Meta-analyses find a modest but real link (around .20)."},
   {q:"Saleh gives a polite smile, then a real one. What gives the real (Duchenne) smile away?",o:["Showing more teeth","Wrinkles around the eyes","A wider mouth","Raised eyebrows"],a:1,why:"A Duchenne smile reaches the eyes and creates ‘crow’s feet’."}]},
 mlq:{day:0,kind:"Questionnaire",title:"Meaning in Life Questionnaire",sub:"MLQ · 10 items · Steger et al. (2006)",type:"scale",
  intro:"Rate each statement for your life right now. Your answers stay on your phone.",
  labels:["Absolutely untrue","Mostly untrue","Somewhat untrue","Can’t say true or false","Somewhat true","Mostly true","Absolutely true"],values:[1,2,3,4,5,6,7],
  items:["I understand my life’s meaning.","I am looking for something that makes my life feel meaningful.","I am always looking to find my life’s purpose.","My life has a clear sense of purpose.","I have a good sense of what makes my life meaningful.","I have discovered a satisfying life purpose.","I am always searching for something that makes my life feel significant.","I am seeking a purpose or mission for my life.","My life has no clear purpose.","I am searching for meaning in my life."],
  score(a){const p=a[0]+a[3]+a[4]+a[5]+(8-a[8]),se=a[1]+a[2]+a[6]+a[7]+a[9];
   const v=p>24&&se>24?"Meaning is present, and you are still exploring it.":p>24?"Your life feels meaningful, and you are not actively searching right now.":se>24?"You are still searching for meaning. This is very common at university.":"You are not focused on meaning right now. Notice which activities and people feel worthwhile to you.";
   return {main:p,max:35,label:"Presence of meaning (5–35)",text:`Search for meaning: ${se} out of 35. ${v}`,
    detail:"Scoring: presence = items 1, 4, 5, 6 and 9 (item 9 reversed: 8 minus your answer). Search = items 2, 3, 7, 8 and 10. 24 is the cut-off used in class. Source: Steger et al. (2006), textbook pp. 89–90."}}},
 // ---------------- DAY 1 ----------------
 glass:{day:1,kind:"Poll",title:"Warm-up poll: half full or half empty?",sub:"Two quick questions before we start",
  type:"poll",items:[
   {q:"When you think about the next five years, you mostly expect…",o:["Things will go well for me","A mix of good and bad","Things will probably go badly"],
    after:"Expecting good outcomes in general is what Scheier and Carver call dispositional optimism. Hold on to your answer: you will test it with the LOT-R today."},
   {q:"Can a person learn to become more optimistic?",o:["Yes, it is a skill","Partly","No, you are born that way"],
    after:"Both answers have support. Seligman treats optimism as a learned way of explaining events; Scheier and Carver treat it as a fairly stable trait. About 25–30% of the differences between people are linked to genes."}]},
 lotr:{day:1,kind:"Questionnaire",title:"LOT-R: how optimistic are you?",sub:"Life Orientation Test – Revised · 10 items · 2 minutes",
  type:"scale",intro:"Answer honestly for yourself, not how you think most people would answer. Your answers stay on your phone.",
  labels:["I disagree a lot","I disagree a little","Neither","I agree a little","I agree a lot"],values:[0,1,2,3,4],
  items:["In uncertain times, I usually expect the best.","It’s easy for me to relax.","If something can go wrong for me, it will.","I’m always optimistic about my future.","I enjoy my friends a lot.","It’s important for me to keep busy.","I hardly ever expect things to go my way.","I don’t get upset too easily.","I rarely count on good things happening to me.","Overall, I expect more good things to happen to me than bad."],
  score(a){const r=v=>4-v;const s=a[0]+a[3]+a[9]+r(a[2])+r(a[6])+r(a[8]);
   return {main:s,max:24,label:"Optimism score (0–24)",
    text:"Higher scores mean more optimism. There are no official cut-offs. Many student samples average around 14–15.",
    detail:"How it is scored: items 2, 5, 6 and 8 are fillers and are not counted. Items 3, 7 and 9 are pessimism items, so they are reversed (4 becomes 0, 3 becomes 1). Source: Scheier, Carver & Bridges (1994), in your textbook p. 111."}}},
 threeps:{day:1,kind:"Quick check",title:"The 3 Ps: spot the explanation",sub:"6 statements · which dimension is it about?",
  type:"quiz",intro:"Each student just got a bad result. Which dimension of explanatory style does his explanation show?",
  items:[
   {q:"Yousef fails a quiz: “I’m always bad at tests. It will never change.”",o:["Permanence","Pervasiveness","Personalisation"],a:0,why:"“Always” and “never change” describe a stable cause. That is the pessimistic side of permanence."},
   {q:"Talal fails a quiz: “I failed this one, so my whole semester is ruined.”",o:["Permanence","Pervasiveness","Personalisation"],a:1,why:"One quiz is spreading to everything (global). That is the pessimistic side of pervasiveness."},
   {q:"Hamad’s project is rejected: “It’s completely my fault. I’m useless.”",o:["Permanence","Pervasiveness","Personalisation"],a:2,why:"He blames only himself (internal). That is the pessimistic side of personalisation."},
   {q:"Fahad loses a match: “We played badly today; next week will be different.”",o:["Permanence","Pervasiveness","Personalisation"],a:0,why:"“Today” and “next week will be different” describe an unstable, temporary cause. That is the optimistic side of permanence."},
   {q:"Nawaf gets a low lab grade: “Lab reports are my weak spot, but my other courses are fine.”",o:["Permanence","Pervasiveness","Personalisation"],a:1,why:"He keeps the problem specific (local). That is the optimistic side of pervasiveness."},
   {q:"Sultan’s presentation goes badly: “The projector failed and the room was noisy.”",o:["Permanence","Pervasiveness","Personalisation"],a:2,why:"He points to outside causes (external). Be careful: research shows stability and globality matter more than internal vs. external."}]},
 abc:{day:1,kind:"Activity",title:"Learning your ABCs",sub:"Turn one setback into a more optimistic explanation",
  type:"abc"},
 quiz1:{day:1,kind:"Quiz",title:"Part 1 exit quiz",sub:"6 questions · instant feedback",type:"quiz",
  items:[
   {q:"Dispositional optimism is best described as…",o:["A broad expectation that outcomes will be good","A way of explaining past failures","The belief that luck controls your life","Thinking that bad things never happen"],a:0,why:"Scheier and Carver define it as a trait: a general expectancy of good outcomes."},
   {q:"Which questionnaire measures dispositional optimism?",o:["ASQ","LOT-R","GSE","MLQ"],a:1,why:"The Life Orientation Test – Revised (10 items). The ASQ measures explanatory style."},
   {q:"A pessimist explains a bad event as…",o:["External, unstable, local","Internal, stable, global","External, stable, local","Internal, unstable, local"],a:1,why:"“It’s me, it will last, and it affects everything.”"},
   {q:"In the ABC model, what is “C”?",o:["Confidence","Control","Consequence","Coping"],a:2,why:"Adversity → Belief → Consequence (your feelings and actions)."},
   {q:"Optimists usually cope with stress by…",o:["Denial and distraction","Planning and seeking support","Giving up early","Ignoring health warnings"],a:1,why:"Optimism predicts active coping; pessimism predicts avoidant coping."},
   {q:"A 2019 review of about 230,000 people found optimists had…",o:["No difference in heart health","About 35% lower risk of heart attack, stroke or cardiac death","Twice the risk of heart disease","Lower grades"],a:1,why:"Rozanski et al. (2019). The link is correlational, so it does not prove optimism causes better health."}]},
 // ---------------- DAY 2 ----------------
 exam:{day:2,kind:"Poll",title:"Warm-up poll: the night before a big exam",sub:"One question, then see what research says",type:"poll",
  items:[{q:"The night before a big exam, you usually…",o:["Expect it to go well and try to relax","Imagine everything that could go wrong, then prepare for each one","Try not to think about it at all"],
   after:"Option 2 is defensive pessimism: setting low expectations and planning for the worst. For anxious students it can work as well as optimism. Option 3 is avoidance, which tends to work worst."}]},
 control:{day:2,kind:"Quick check",title:"Internal or external?",sub:"Locus of control · 5 statements",type:"quiz",intro:"Is each student showing an internal or an external locus of control?",
  items:[
   {q:"Abdullah: “I got an A because I studied every day for two weeks.”",o:["Internal","External"],a:0,why:"He links the result to his own effort."},
   {q:"Bader: “Grades depend on which instructor you get. Nothing I do changes it.”",o:["Internal","External"],a:1,why:"He believes powerful others decide the outcome."},
   {q:"Mubarak: “I lost because the other team was lucky.”",o:["Internal","External"],a:1,why:"Luck or chance is an external cause."},
   {q:"Saud: “If I practise my presentation, I can control how nervous I look.”",o:["Internal","External"],a:0,why:"He sees his own actions as making the difference."},
   {q:"Meshari: “Whether I get the internship is in God’s hands, but I will prepare as hard as I can.”",o:["Internal","External"],a:0,why:"A mix: he accepts what he cannot control and still takes responsibility for effort. The textbook notes LOC can vary by situation."}]},
 gse:{day:2,kind:"Questionnaire",title:"General Self-Efficacy Scale",sub:"GSE · 10 items · 2 minutes",type:"scale",
  intro:"How true is each statement about you? Your answers stay on your phone.",
  labels:["Not at all true","Hardly true","Moderately true","Exactly true"],values:[1,2,3,4],
  items:["I can always manage to solve difficult problems if I try hard enough.","If someone opposes me, I can find the means and ways to get what I want.","It is easy for me to stick to my aims and accomplish my goals.","I am confident that I could deal efficiently with unexpected events.","Thanks to my resourcefulness, I know how to handle unforeseen situations.","I can solve most problems if I invest the necessary effort.","I can remain calm when facing difficulties because I can rely on my coping abilities.","When I am confronted with a problem, I can usually find several solutions.","If I am in trouble, I can usually think of a solution.","I can usually handle whatever comes my way."],
  score(a){const s=a.reduce((x,y)=>x+y,0);return {main:s,max:40,label:"Self-efficacy score (10–40)",
   text:`Your average item score is ${(s/10).toFixed(1)} out of 4. The textbook reports an average total of about 29. There is no cut-off.`,
   detail:"Source: Schwarzer & Jerusalem (1995), in your textbook pp. 112–113. Remember: self-efficacy is specific to tasks and situations, so your score may differ for exams, sport or public speaking."}}},
 sources:{day:2,kind:"Quick check",title:"Where does self-efficacy come from?",sub:"Bandura’s sources · 4 scenarios",type:"quiz",
  items:[
   {q:"Khaled finally solves a hard coding problem on his own. Now he believes he can do the next one.",o:["Mastery experience","Vicarious experience","Verbal persuasion","Imaginal experience"],a:0,why:"His own direct success. This is the most powerful source."},
   {q:"Ali watches a classmate from his own section give a great presentation and thinks, “If he can, I can.”",o:["Mastery experience","Vicarious experience","Verbal persuasion","Imaginal experience"],a:1,why:"Learning by watching a similar model. The closer you identify with the model, the stronger the effect."},
   {q:"Faisal’s supervisor tells him, “You’re ready to lead this site visit.”",o:["Mastery experience","Vicarious experience","Verbal persuasion","Imaginal experience"],a:2,why:"Encouragement from someone else."},
   {q:"Before his interview, Yaqoub pictures himself answering every question calmly.",o:["Mastery experience","Vicarious experience","Verbal persuasion","Imaginal experience"],a:3,why:"Imagining yourself acting effectively (Maddux, 2002)."}]},
 hope:{day:2,kind:"Questionnaire",title:"Adult Hope Scale",sub:"12 items · agency and pathways · 3 minutes",type:"scale",
  intro:"How true is each statement about you? Your answers stay on your phone.",
  labels:["Definitely false","Mostly false","Somewhat false","Slightly false","Slightly true","Somewhat true","Mostly true","Definitely true"],values:[1,2,3,4,5,6,7,8],
  items:["I can think of many ways to get out of a jam.","I energetically pursue my goals.","I feel tired most of the time.","There are lots of ways around any problem.","I am easily downed in an argument.","I can think of many ways to get the things in life that are important to me.","I worry about my health.","Even when others get discouraged, I know I can find a way to solve the problem.","My past experiences have prepared me well for my future.","I’ve been pretty successful in life.","I usually find myself worrying about something.","I meet the goals that I set for myself."],
  score(a){const ag=a[1]+a[8]+a[9]+a[11],pa=a[0]+a[3]+a[5]+a[7];return {main:ag+pa,max:64,label:"Total hope (8–64)",
   text:`Agency (the will): ${ag} out of 32 · Pathways (the ways): ${pa} out of 32. Higher means more hope. Compare your two parts: which one is stronger?`,
   detail:"Scoring: agency = items 2, 9, 10, 12; pathways = items 1, 4, 6, 8. Items 3, 5, 7 and 11 are fillers. Source: Snyder et al. (1991)."}}},
 bps:{day:2,kind:"Activity",title:"Best Possible Self",sub:"5-minute writing exercise",type:"bps"},
 quiz2:{day:2,kind:"Quiz",title:"Part 2 exit quiz",sub:"6 questions · instant feedback",type:"quiz",
  items:[
   {q:"Defensive pessimists…",o:["Never prepare","Set low expectations and plan for problems","Always perform worse than optimists","Have an external locus of control"],a:1,why:"Norem and Cantor (1986). They do worse if they are stopped from planning for the worst."},
   {q:"Thinking you are less likely than average to have a car accident is…",o:["Defensive pessimism","Unrealistic optimism","Self-efficacy","Collective efficacy"],a:1,why:"An optimistic bias in risk perception."},
   {q:"In Langer and Rodin’s (1976) study, residents who were given choices and a plant…",o:["Felt worse","Showed no change","Were more active and had lower mortality","Became more pessimistic"],a:2,why:"Mortality was 15% vs. 30% about 15 months later. A related study (Schulz & Hanusa, 1978) found that benefits faded when the sense of control was later taken away."},
   {q:"Self-efficacy is best described as…",o:["A fixed personality trait","Your overall self-worth","Belief that you can do a specific task","Your actual level of skill"],a:2,why:"“The power of I can”: domain-specific and not the same as skill or self-esteem."},
   {q:"In Snyder’s hope theory, “pathways” means…",o:["The will to keep going","Being able to find routes to your goals","Expecting good things in general","Explaining failure as temporary"],a:1,why:"Hope = agency (the will) + pathways (the ways)."},
   {q:"Which intervention had the strongest effect on optimism in a 2017 meta-analysis?",o:["Positive affirmations","Best Possible Self","Watching comedy","Sleep training"],a:1,why:"Malouff and Schutte (2017) pooled 29 trials: optimism rose overall (g = .41), and Best Possible Self had the largest effects."}]},
 // ---------------- CHAPTER 6 ----------------
 stress:{day:6,kind:"Poll",title:"Warm-up poll: stress and you",sub:"Two quick questions before we start",type:"poll",items:[
   {q:"Which of these stresses you most this semester?",o:["Exams and deadlines","Family expectations","Money or work","Health or sleep","My future and career"],
    after:"Most of these are everyday stressors. A trauma is different: an event that threatens your life or safety, or someone else’s. Today we look at how people respond to both."},
   {q:"When something goes wrong, what do you usually do first?",o:["Make a plan and fix it","Talk to someone I trust","Distract myself (games, phone, sleep)","Pray, reflect or look for meaning"],
    after:"These match the coping styles we study today: problem-focused, social support, avoidance and meaning-focused coping. Remember your answer."}]},
 brs:{day:6,kind:"Questionnaire",title:"Brief Resilience Scale",sub:"BRS · 6 items · 1 minute",type:"scale",
  intro:"How much do you agree with each statement? Answer for yourself. Your answers stay on your phone.",
  labels:["Strongly disagree","Disagree","Neutral","Agree","Strongly agree"],values:[1,2,3,4,5],
  items:["I tend to bounce back quickly after hard times.","I have a hard time making it through stressful events.","It does not take me long to recover from a stressful event.","It is hard for me to snap back when something bad happens.","I usually come through difficult times with little trouble.","I tend to take a long time to get over set-backs in my life."],
  score(a){const r=v=>6-v;const s=(a[0]+r(a[1])+a[2]+r(a[3])+a[4]+r(a[5]))/6;const m=Math.round(s*100)/100;
   const band=m<3?"low":m<=4.3?"normal":"high";
   return {main:m.toFixed(2),max:5,label:"Resilience score (1–5)",
    text:`Your score is in the ${band} range (low 1.00–2.99 · normal 3.00–4.30 · high 4.31–5.00). The BRS measures one thing: how quickly you feel you bounce back.`,
    detail:"Scoring: items 2, 4 and 6 are reversed (6 minus your answer); the score is the average of all six. Source: Smith et al. (2008). Resilience can be built: see the ABCDE activity."}}},
 coping:{day:6,kind:"Quick check",title:"Which coping strategy is it?",sub:"Coping styles · 5 scenarios",type:"quiz",intro:"Each student is under stress. Which coping strategy is he using?",
  items:[
   {q:"Yousef has three exams next week. He makes a study timetable and books a meeting with his instructor.",o:["Problem-focused","Emotion-focused","Avoidance","Meaning-focused"],a:0,why:"He acts on the problem itself: planning and getting information."},
   {q:"Bader is waiting for his grades and cannot change them. He goes for a run to calm down.",o:["Problem-focused","Emotion-focused","Avoidance","Meaning-focused"],a:1,why:"He manages his feelings. When a situation cannot be changed, emotion-focused coping is a good fit."},
   {q:"Faisal has a group project problem. He plays games all night and turns off his phone.",o:["Problem-focused","Emotion-focused","Avoidance","Meaning-focused"],a:2,why:"He escapes the problem. Avoidance can help for a short time, but usually makes stress worse later."},
   {q:"After his father’s illness, Hamad says, “This taught me how much my family means to me.”",o:["Problem-focused","Emotion-focused","Avoidance","Meaning-focused"],a:3,why:"He draws on values and finds meaning in a hard event (Folkman’s meaning-focused coping)."},
   {q:"Abdullah fails his driving test. He asks the examiner what went wrong and practises those parts.",o:["Problem-focused","Emotion-focused","Avoidance","Meaning-focused"],a:0,why:"He targets the cause of the problem with a plan."}]},
 ptg:{day:6,kind:"Quick check",title:"The five domains of growth",sub:"Post-traumatic growth · 5 statements",type:"quiz",intro:"Each person went through a hard event. Which domain of post-traumatic growth does his statement show?",
  items:[
   {q:"Mubarak, after a car accident: “I notice small things now: breakfast with my kids, the sunset.”",o:["Relating to others","New possibilities","Personal strength","Spiritual change","Appreciation of life"],a:4,why:"A changed sense of what matters, and greater appreciation of each day."},
   {q:"Saud, after losing his job: “I started the small business I always talked about.”",o:["Relating to others","New possibilities","Personal strength","Spiritual change","Appreciation of life"],a:1,why:"New paths and opportunities that were not there before."},
   {q:"Khaled, after cancer treatment: “If I got through that, I can handle anything.”",o:["Relating to others","New possibilities","Personal strength","Spiritual change","Appreciation of life"],a:2,why:"A greater sense of personal strength: vulnerable, yet stronger."},
   {q:"Nasser, after his brother’s death: “My faith is deeper and I pray with more meaning.”",o:["Relating to others","New possibilities","Personal strength","Spiritual change","Appreciation of life"],a:3,why:"Spiritual or existential change."},
   {q:"Ahmad, after a house fire: “I learned who my real friends are, and I am closer to my family.”",o:["Relating to others","New possibilities","Personal strength","Spiritual change","Appreciation of life"],a:0,why:"Closer, more meaningful relationships and more compassion for others."}]},
 ageing:{day:6,kind:"Quick check",title:"Ageing: myth or fact?",sub:"5 statements · what does research say?",type:"quiz",
  items:[
   {q:"Most older adults are lonely and unhappy.",o:["Myth","Fact"],a:0,why:"Many older adults report stable or higher well-being: the “paradox of ageing”."},
   {q:"In many countries, life satisfaction follows a U-shape: lowest in middle age, higher later.",o:["Myth","Fact"],a:1,why:"Blanchflower (2021) found a U-shape in 145 countries, with the low point around the late 40s."},
   {q:"How you think about ageing can affect how long you live.",o:["Myth","Fact"],a:1,why:"Levy et al. (2002): people with positive views of ageing lived about 7.5 years longer."},
   {q:"Healthy ageing is mostly decided by your genes, so lifestyle hardly matters.",o:["Myth","Fact"],a:0,why:"Vaillant’s Grant Study: factors under our control (not smoking, exercise, healthy weight, education, relationships) predicted healthy ageing."},
   {q:"Older adults tend to remember positive information better than negative information.",o:["Myth","Fact"],a:1,why:"The positivity effect (Carstensen): as time feels shorter, people focus on emotionally meaningful goals."}]},
 quiz6:{day:6,kind:"Quiz",title:"Chapter 6 exit quiz",sub:"6 questions · instant feedback",type:"quiz",
  items:[
   {q:"After a potentially traumatic event, the most common pattern is…",o:["Chronic distress","Delayed PTSD","Resilience: stable, healthy functioning","Post-traumatic growth"],a:2,why:"Galatzer-Levy et al. (2018): about two thirds of people (65.7%) show a resilient trajectory."},
   {q:"Lepore and Revenson’s “reconfiguration” means…",o:["Low distress during the event","Returning to normal","Changing as a result of the trauma","Avoiding the problem"],a:2,why:"Recovery = back to normal; resistance = low distress; reconfiguration = change after trauma."},
   {q:"Talking to your boss and making a plan to improve is…",o:["Emotion-focused coping","Problem-focused coping","Avoidance","Succumbing"],a:1,why:"It targets the problem itself (Lazarus & Folkman)."},
   {q:"Which is NOT one of the five PTG domains?",o:["Appreciation of life","Personal strength","Higher income","New possibilities"],a:2,why:"The domains: relating to others, new possibilities, personal strength, spiritual change, appreciation of life."},
   {q:"In the ABCDE method, “D” stands for…",o:["Depression","Disputation","Distraction","Denial"],a:1,why:"Disputation: arguing back against the pessimistic belief."},
   {q:"Selection, Optimisation and Compensation (SOC) is a strategy for…",o:["Positive ageing","Measuring trauma","Diagnosing PTSD","Avoiding stress"],a:0,why:"Baltes and Baltes (1990): focus on key goals, build on strengths, adapt around losses."}]},
 // ---------------- CHAPTER 7 ----------------
 goals7:{day:71,chap:"Chapter 7 · Part 1",kind:"Poll",title:"Your goal for this year",sub:"Two questions · what and why",type:"poll",items:[
   {q:"What is your most important goal for this year?",o:["Good grades / graduating","A good job or career start","Earning money","Health and fitness","Family and friendships","Looking good / being admired","Helping others or my community"],
    after:"Researchers sort goals into intrinsic (growth, relationships, health, community) and extrinsic (money, image, fame). Intrinsic goals tend to bring more lasting well-being. Grades and careers can be either: it depends on WHY you chase them."},
   {q:"Why are you pursuing this goal?",o:["I enjoy it or find it interesting","It is truly important to me","I would feel guilty or ashamed if I didn’t","Others expect it, or I want a reward","Honestly, I’m not sure"],
    after:"These five answers sit on a line from controlled to autonomous motivation. “I enjoy it” and “It matters to me” are the most autonomous, and they predict more effort, persistence and well-being."}]},
 needs7:{day:71,chap:"Chapter 7 · Part 1",kind:"Questionnaire",title:"Are your needs being met?",sub:"Autonomy · competence · relatedness · 9 items",type:"scale",
  intro:"Think about your life at university this semester. How true is each statement for you? Your answers stay on your phone.",
  labels:["Not at all true","Slightly true","Somewhat true","Mostly true","Completely true"],values:[1,2,3,4,5],
  items:["I feel free to make my own choices about my studies.","I often feel pressured to do things I don’t want to do.","What I do at university reflects what I really want.","I feel capable in my courses.","I often feel like I am failing at my studies.","I am learning new skills and can see my progress.","I feel connected to people at university.","I often feel alone or left out.","People here care about me."],
  score(a){const r=v=>6-v;const A=(a[0]+r(a[1])+a[2])/3,C=(a[3]+r(a[4])+a[5])/3,R=(a[6]+r(a[7])+a[8])/3;
   const f=x=>x.toFixed(1);const all=(A+C+R)/3;const n=[["autonomy",A,"choose one task this week that you do in your own way, for your own reasons"],["competence",C,"break a hard task into small steps and notice each one you finish"],["relatedness",R,"join a study group or club, or message a classmate you’d like to know"]].sort((x,y)=>x[1]-y[1]);
   return {main:f(all),max:5,label:"Overall need satisfaction (1–5)",
    text:`Autonomy ${f(A)} · Competence ${f(C)} · Relatedness ${f(R)}. Your lowest need right now is ${n[0][0]}. One idea: ${n[0][2]}.`,
    detail:"Items 2, 5 and 8 are reversed (6 minus your answer). Each need score is the average of its three items. A short classroom check, not an official scale."}}},
 goaltypes7:{day:71,chap:"Chapter 7 · Part 1",kind:"Quick check",title:"Which goal will make him happier?",sub:"Goals that aid happiness · 5 scenarios",type:"quiz",intro:"Each student is choosing between two goals. Which goal is more likely to support his well-being?",
  items:[
   {q:"Yousef is choosing a goal for the gym.",o:["“Get stronger and feel more energetic”","“Look better than my friends in photos”"],a:0,why:"An intrinsic goal (health, growth) supports well-being more than an image goal."},
   {q:"Bader wants to change how he speaks in class.",o:["“Stop embarrassing myself when I talk”","“Share one idea in every class”"],a:1,why:"An approach goal (moving toward something) beats an avoidance goal (moving away from something you fear)."},
   {q:"Faisal’s goals: top grades AND working 30 hours a week AND football every evening.",o:["Keep all three as they are","Adjust them so they fit together"],a:1,why:"Goals that conflict pull against each other. Harmonious goals support each other."},
   {q:"Hamad chose engineering because his father wants it, but he loves design.",o:["Find a way to connect the goal to his own values","Push on and ignore how he feels"],a:0,why:"Goals that fit your values (self-concordant goals) bring more effort and satisfaction."},
   {q:"Abdullah wants to be happier this semester.",o:["“Buy the new phone everyone has”","“Join the volunteering club”"],a:1,why:"Activity goals (new experiences, clubs, helping) last longer than buying things, which we quickly get used to."}]},
 quiz7a:{day:71,chap:"Chapter 7 · Part 1",kind:"Quiz",title:"Part 1 exit quiz",sub:"6 scenarios · instant feedback",type:"quiz",
  items:[
   {q:"Talal studies psychology because he finds people fascinating. His motivation is mostly…",o:["Controlled by others","Autonomous: from his own interest","Driven by guilt","Absent"],a:1,why:"Doing something out of interest is intrinsic, the most autonomous form of motivation."},
   {q:"Saud studies hard only so his parents won’t be angry. What is the likely long-term effect?",o:["Stronger interest in the subject","Less enjoyment and persistence than studying for himself","No effect on motivation","He will become more creative"],a:1,why:"Controlled motivation (pressure, fear of punishment) is linked to less persistence and lower well-being."},
   {q:"A manager lets her team choose how to finish a project and explains why it matters. She is supporting their…",o:["Competence only","Autonomy","Relatedness only","Fear of failure"],a:1,why:"Offering choice and a meaningful reason supports autonomy."},
   {q:"Nasser has been chasing a goal for three years with no progress, and it makes him miserable. What helps most?",o:["Never give up on any goal","Let it go and commit to a new, reachable goal","Blame himself until he succeeds","Stop setting goals"],a:1,why:"Being able to let go of an unreachable goal and re-engage with a new one supports well-being."},
   {q:"Which goal is most likely to make Khaled happier in the long run?",o:["Becoming famous on social media","Owning an expensive car","Building close friendships","Being seen as the best-looking"],a:2,why:"Relationship goals are intrinsic. Goals about fame, money and image predict lower well-being."},
   {q:"Mubarak’s new job pays well, but he feels lonely and has no say in his work. Which needs are not being met?",o:["Competence and income","Relatedness and autonomy","None: the pay is enough","Only competence"],a:1,why:"Feeling lonely = relatedness; no say in his work = autonomy. Money does not meet psychological needs."}]},
 values7:{day:72,chap:"Chapter 7 · Part 2",kind:"Poll",title:"What do you value most?",sub:"Ten values · two questions",type:"poll",items:[
   {q:"Which value guides your life the MOST?",o:["Power: status, control, resources","Achievement: success, being competent","Pleasure: enjoying life","Stimulation: excitement, new things","Self-direction: independence, my own ideas","Universalism: fairness, tolerance, nature","Benevolence: caring for family and friends","Tradition: religion, customs, heritage","Conformity: following rules, respecting others","Security: safety, stability, order"],
    after:"Values next to each other in the circle fit together (for example, benevolence and universalism). Values on opposite sides pull against each other (for example, power and universalism)."},
   {q:"Which value matters LEAST to you right now?",o:["Power","Achievement","Pleasure","Stimulation","Self-direction","Universalism","Benevolence","Tradition","Conformity","Security"],
    after:"There are no right answers. Well-being comes from living in line with YOUR values, whatever they are."}]},
 tp7:{day:72,chap:"Chapter 7 · Part 2",kind:"Questionnaire",title:"What is your time perspective?",sub:"Past · present · future · 10 items",type:"scale",
  intro:"How true is each statement for you? Your answers stay on your phone.",
  labels:["Very untrue","Untrue","Neutral","True","Very true"],values:[1,2,3,4,5],
  items:["I make plans and lists so I meet my deadlines.","When I have work to do, I resist temptations and fun.","I often do things on impulse, just for the fun of it.","I enjoy taking risks to make life exciting.","Planning is pointless, because things never turn out as planned.","My life is mostly controlled by things I cannot change.","I enjoy family stories and memories of the good old days.","Happy memories of the past come easily to me.","I often think about bad things that happened to me.","I keep thinking about what I should have done differently."],
  score(a){const m=(i)=>(a[i]+a[i+1])/2;const T=[["Future",m(0)],["Present-hedonistic",m(2)],["Present-fatalistic",m(4)],["Past-positive",m(6)],["Past-negative",m(8)]];
   const top=[...T].sort((x,y)=>y[1]-x[1])[0];
   return {main:top[1].toFixed(1),max:5,label:"Strongest: "+top[0]+" (1–5)",
    text:T.map(t=>t[0]+" "+t[1].toFixed(1)).join(" · ")+".",
    detail:"A balanced profile: high past-positive; fairly high future and present-hedonistic; low past-negative and present-fatalistic. A short classroom check based on the five time perspectives, not the official questionnaire."}}},
 time7:{day:72,chap:"Chapter 7 · Part 2",kind:"Poll",title:"Where does your time go?",sub:"Two quick questions",type:"poll",items:[
   {q:"On a normal day, how many hours do you spend on your phone (not for study)?",o:["Less than 2","2 to 4","4 to 6","More than 6","I don’t know"],
    after:"Check your phone’s Screen Time to see the real number. Most people guess low."},
   {q:"If you had one extra free hour every day, how would you use it?",o:["Sleep and rest","Family and friends","Exercise or sport","Study or career","A hobby or learning something new","More time on my phone"],
    after:"Compare your answer with how you actually spend time now. The gap shows where your time and your values do not match."}]},
 quiz7b:{day:72,chap:"Chapter 7 · Part 2",kind:"Quiz",title:"Part 2 exit quiz",sub:"6 scenarios · instant feedback",type:"quiz",
  items:[
   {q:"Waleed values family above everything but works 70 hours a week for a bonus. Why might he feel unhappy?",o:["His goals don’t match his values","Bonuses always make people unhappy","He values family too much","He needs a bigger bonus"],a:0,why:"Satisfaction comes from goals and activities that fit our values."},
   {q:"Jasem wants a powerful, high-status career and also to spend his life helping refugees. What might he feel?",o:["No conflict at all","Tension between values on opposite sides of the circle","Only boredom","Only pride"],a:1,why:"Power (self-enhancement) and universalism (self-transcendence) sit opposite each other, so they often conflict."},
   {q:"Omar says: “Why plan? Whatever happens will happen anyway.” Which time perspective is this?",o:["Future","Past-positive","Present-fatalistic","Present-hedonistic"],a:2,why:"A hopeless belief that outside forces control your life is present-fatalistic."},
   {q:"Ahmad parties the night before every exam because “it’s more fun now”. Which time perspective is he showing?",o:["Present-hedonistic","Future","Past-negative","Balanced"],a:0,why:"Choosing pleasure now with little thought for consequences is present-hedonistic."},
   {q:"Talal keeps replaying a mistake he made two years ago. Which perspective is this?",o:["Past-positive","Past-negative","Future","Present-hedonistic"],a:1,why:"Focusing on bad or painful past experiences is past-negative."},
   {q:"Which student shows a balanced time perspective?",o:["Saud never relaxes and only thinks about future success","Faisal plans his studies, enjoys weekends with friends and values family memories","Bader lives only for today","Khaled mostly thinks about past mistakes"],a:1,why:"A balanced perspective moves flexibly between past, present and future, as the situation needs."}]},
 // ---------------- CHAPTER 8 ----------------
 mind8:{day:8,chap:"Chapter 8",kind:"Poll",title:"Warm-up: what do you believe about ability?",sub:"Two quick questions",type:"poll",items:[
   {q:"“Your intelligence is something you can’t change very much.” How much do you agree?",o:["Strongly agree","Agree","Not sure","Disagree","Strongly disagree"],
    after:"Agreeing points toward a fixed mindset (ability is carved in stone). Disagreeing points toward a growth mindset (ability can be developed). Most people hold a mix of both."},
   {q:"You get a low grade on your first quiz in a new course. What is your FIRST thought?",o:["“I’m just not good at this subject.”","“The teacher is unfair.”","“I need a different way to study.”","“I’ll ask for help and try again.”"],
    after:"The first answer is fixed-mindset thinking. The last two are growth-mindset thinking: they treat the grade as information about strategy, not about who you are."}]},
 praise8:{day:8,chap:"Chapter 8",kind:"Quick check",title:"Growth or fixed?",sub:"Praise and self-talk · 5 scenarios",type:"quiz",intro:"Choose the response that builds a growth mindset.",
  items:[
   {q:"Yousef’s little brother solves a hard puzzle. What should Yousef say?",o:["“You’re so smart!”","“You kept trying different ways until it worked.”","“That was easy for you.”","“You’re a natural.”"],a:1,why:"Praising effort and strategy (the process) builds persistence. Praising intelligence teaches that ability is fixed."},
   {q:"Bader fails his first coding assignment. Which thought shows a growth mindset?",o:["“I’m not a computer person.”","“Coding is only for geniuses.”","“I haven’t learned this YET. What can I practise?”","“I’ll avoid coding courses.”"],a:2,why:"“Not yet” treats ability as something that develops with practice."},
   {q:"A manager tells Faisal: “Great result. Which approach worked best, and what would you change next time?” This feedback…",o:["Focuses on talent","Focuses on the process and learning","Is a fixed-mindset message","Is only about the outcome"],a:1,why:"Asking about strategies and next steps keeps attention on learning, not on proving ability."},
   {q:"Hamad avoids the advanced math class “so I don’t look stupid”. His goal is mainly…",o:["A learning goal","A performance goal: looking smart","A growth goal","A social goal"],a:1,why:"Avoiding challenge to protect your image is a performance (fixed-mindset) goal."},
   {q:"Abdullah tells his friend, “Just try harder!” after the same failed method three times. What is missing?",o:["Nothing: effort is all that matters","A new strategy and help from others","More praise for intelligence","Lower expectations"],a:1,why:"Growth mindset is not effort alone. It means effort plus new strategies and asking for help."}]},
 grit8:{day:8,chap:"Chapter 8",kind:"Questionnaire",title:"How gritty are you?",sub:"Perseverance and passion · 8 items",type:"scale",
  intro:"How much is each statement like you? Your answers stay on your phone.",
  labels:["Not like me at all","Not much like me","Somewhat like me","Mostly like me","Very much like me"],values:[1,2,3,4,5],
  items:["I finish whatever I begin.","Setbacks don’t discourage me for long.","I keep working hard even when progress is slow.","I have reached a goal that took years of work.","New ideas and projects often distract me from older ones.","I often set a goal but later choose a different one.","I lose interest in projects after a few weeks.","My interests change from year to year."],
  score(a){const r=v=>6-v;const P=(a[0]+a[1]+a[2]+a[3])/4,I=(r(a[4])+r(a[5])+r(a[6])+r(a[7]))/4;const f=x=>x.toFixed(1);
   return {main:f((P+I)/2),max:5,label:"Your grit score (1–5)",
    text:`Perseverance of effort ${f(P)} · Consistency of interest ${f(I)}. Research suggests the perseverance part matters more for performance than the consistency part.`,
    detail:"Items 5–8 are reversed (6 minus your answer). A short classroom check inspired by the grit scale, not the official one. The official scale is at angeladuckworth.com/grit-scale."}}},
 stage8:{day:8,chap:"Chapter 8",kind:"Poll",title:"Which stage of change are you in?",sub:"One habit · two questions",type:"poll",
  intro:"Pick ONE habit you would like to change: sleep, exercise, phone use, food, or study routine.",items:[
   {q:"Which stage are you in for that habit?",o:["Not thinking about changing it yet","Thinking about it, but not ready","Planning to start in the next month","I started changing it recently","I changed it more than 6 months ago"],
    after:"These are the five stages: pre-contemplation, contemplation, preparation, action and maintenance. Slipping back is normal: most people cycle through the stages more than once."},
   {q:"What usually stops you from changing?",o:["I forget","Not enough time","I lose motivation","People around me","I don’t know how to start"],
    after:"Each obstacle has a different fix: reminders and if-then plans, smaller steps, a reason that is truly yours, support from others, or a clear first step."}]},
 ppi8:{day:8,chap:"Chapter 8",kind:"Poll",title:"Find your best-fit activity",sub:"Person–activity fit · two questions",type:"poll",items:[
   {q:"Which positive activity would you most like to try this week?",o:["Three good things (write them each night)","A gratitude letter or visit","Savouring a good moment","Best possible self (write about your future)","Acts of kindness","Using a strength in a new way","Exercise or sport","Calm breathing or mindfulness"],
    after:"Activities work best when they feel natural to you, fit your strengths and fit your lifestyle. Variety also helps: change the activity or the way you do it now and then."},
   {q:"Which one would feel most FORCED or unnatural for you?",o:["Three good things","Gratitude letter or visit","Savouring","Best possible self","Acts of kindness","Using a strength in a new way","Exercise or sport","Calm breathing or mindfulness"],
    after:"An activity that feels forced is less likely to help, even if it works well for others. That is person–activity fit."}]},
 quiz8:{day:8,chap:"Chapter 8",kind:"Quiz",title:"Chapter 8 exit quiz",sub:"6 scenarios · instant feedback",type:"quiz",
  items:[
   {q:"Talal says, “I’m bad at presentations, so there’s no point practising.” This is an example of…",o:["A growth mindset","A fixed mindset","Grit","Savouring"],a:1,why:"Believing ability can’t change, so effort is pointless, is fixed-mindset thinking."},
   {q:"Saud’s father praises him: “You worked on that essay every day this week. It shows!” What will this most likely build?",o:["Fear of failure","Belief that effort and strategy lead to progress","Belief that he is naturally gifted","Less motivation"],a:1,why:"Process praise focuses on effort and strategy, which supports a growth mindset."},
   {q:"Nasser has trained for a marathon for two years, through injuries and bad weather. He is showing…",o:["Grit: perseverance and passion for a long-term goal","A performance goal","Present-hedonistic time perspective","Avoidance"],a:0,why:"Sticking with a long-term goal despite setbacks is grit."},
   {q:"Khaled knows he sleeps too little and plans to fix his routine next month. Which stage of change is he in?",o:["Pre-contemplation","Preparation","Action","Maintenance"],a:1,why:"Intending to act soon and making a plan is the preparation stage."},
   {q:"Mubarak quit sugary drinks for three weeks, then had one at a party. What is the best way to see this?",o:["He has failed completely","Slipping back is a normal part of change; he can continue","He should give up","Change is impossible"],a:1,why:"Relapse is common in the change cycle. It is information, not the end."},
   {q:"Ahmad tried a gratitude journal but found it forced and boring. What should he do?",o:["Force himself to continue","Try a different activity that fits him better","Stop all positive activities","Write longer entries"],a:1,why:"Person–activity fit: activities that feel natural and fit your strengths work best."}]},
 // ---------------- CHAPTER 9 ----------------
 pa9:{day:9,chap:"Chapter 9",kind:"Poll",title:"Warm-up: how active are you?",sub:"Two quick questions",type:"poll",items:[
   {q:"Last week, on how many days did you move for 30+ minutes enough to breathe harder (walking fast, sport, gym)?",o:["0 days","1–2 days","3–4 days","5 or more days"],
    after:"The WHO recommends at least 150 minutes of moderate activity a week for adults, for example 30 minutes on 5 days, plus muscle-strengthening on 2 days."},
   {q:"What stops you most from being more active?",o:["No time","The heat or weather","No energy or too tired","No place or facilities","I’m not motivated","I don’t like exercising alone"],

 type9:{day:9,chap:"Chapter 9",kind:"Quick check",title:"Activity, exercise or sport?",sub:"5 scenarios",type:"quiz",intro:"Is each example everyday physical activity, planned exercise, or sport?",
  items:[
   {q:"Yousef takes the stairs to his class on the 4th floor instead of the lift.",o:["Physical activity","Exercise","Sport"],a:0,why:"Any body movement that uses energy counts as physical activity, even if it is not planned training."},
   {q:"Bader goes to a Pilates class every Monday and Wednesday to improve his posture.",o:["Physical activity","Exercise","Sport"],a:1,why:"Exercise is planned, structured and repeated to improve health or fitness."},

   {q:"Abdullah says, “I’m always tired, so I can’t exercise.” What does research suggest?",o:["Rest more; activity drains energy","Regular moderate activity usually increases energy","Only intense training helps"],a:1,why:"Regular moderate activity tends to raise energy and lower fatigue over time."}]},
 mood9:{day:9,chap:"Chapter 9",kind:"Experiment",title:"3-minute movement experiment",sub:"Rate your mood before and after",type:"poll",
  intro:"Answer question 1 now. Then do 3 minutes of movement with the class. Then answer question 2.",items:[
   {q:"BEFORE: How do you feel right now?",o:["1 · Very low","2 · Low","3 · OK","4 · Good","5 · Very good"],

 why9:{day:9,chap:"Chapter 9",kind:"Poll",title:"Why we move",sub:"Motivation and well-being · two questions",type:"poll",items:[
   {q:"What is your MAIN reason for being active (or the reason you would be)?",o:["I enjoy it","To be healthy","To look good","To be with friends or a team","Someone tells me to (doctor, family, coach)","I’m not active"],
    after:"Remember Chapter 7: enjoyment and personal value (autonomous reasons) keep people active longer than pressure or appearance alone."},
   {q:"What do you get MOST from physical activity?",o:["Positive emotions: it feels good","Engagement: I get absorbed (flow)","Relationships: time with others","Meaning: it matters to me","Achievement: progress and goals"],

 quiz9:{day:9,chap:"Chapter 9",kind:"Quiz",title:"Chapter 9 exit quiz",sub:"6 scenarios · instant feedback",type:"quiz",
  items:[
   {q:"Talal walks to the mosque every day and plays with his kids in the park. Does this count as physical activity?",o:["No, only gym training counts","Yes: any movement that uses energy counts","Only if he sweats a lot","Only if it is competitive"],a:1,why:"Physical activity is any body movement produced by muscles that uses energy."},
   {q:"Saud is stressed before exams. Which activity is most likely to help his mood?",o:["A tense, competitive match","A rhythmic swim or walk with steady breathing","Sitting still all day","An unpredictable obstacle race"],a:1,why:"Rhythmic, non-competitive, predictable movement with steady breathing is linked to mood benefits."},
   {q:"Nasser does about half the recommended weekly activity. What does research suggest?",o:["It is useless unless he does the full amount","Even this amount is linked to lower risk of depression","It harms his mental health","Only athletes benefit"],a:1,why:"Even half the recommended amount was linked to a lower risk of depression. Every move counts."},
   {q:"Khaled lifts weights only because his friends mock his body. Compared with exercising for enjoyment, he is likely to…",o:["Stay active longer","Quit sooner and enjoy it less","Feel more autonomous","Reach flow more often"],a:1,why:"Controlled reasons (pressure, appearance) predict less enjoyment and persistence than autonomous reasons."},
   {q:"After a knee injury ended his football career, Mubarak became a coach and says it gave his life new purpose. This shows…",o:["Physical pain can never lead to anything positive","Struggle with the body can lead to meaning and growth","He is avoiding his feelings","Coaching is a sport"],a:1,why:"The textbook notes that physical pain and illness can sometimes bring meaning and growth."},
   {q:"Ahmad wants to add a positive psychology activity to his running club. Which is the best example?",o:["Run in silence and never talk","After each run, share three good things about it","Compare times to shame slow runners","Run only when he feels perfect"],a:1,why:"Adapting a positive intervention (three good things, savouring) to the activity adds positive emotion and connection."}]},

 at10:{day:101,chap:"Chapter 10 · Part 1",kind:"Poll",title:"Warm-up: you at your best",sub:"Two quick questions",type:"poll",items:[
   {q:"Think of a time you were at your best. Which group of strengths were you mostly using?",o:["Wisdom: curiosity, creativity, learning","Courage: bravery, perseverance, honesty","Humanity: love, kindness, social intelligence","Justice: teamwork, fairness, leadership","Temperance: forgiveness, humility, self-control","Transcendence: gratitude, hope, humour, faith"],
    after:"These are the six virtues of the Values in Action (VIA) classification, which groups 24 character strengths."},
   {q:"Have you ever taken a strengths test?",o:["Yes, the VIA Survey","Yes, CliftonStrengths (Gallup)","Yes, another test","No, never"],

 via10:{day:101,chap:"Chapter 10 · Part 1",kind:"Questionnaire",title:"Find your top 5 strengths",sub:"24 strengths · 4 minutes",type:"scale",
  intro:"How much is each statement like you? Go with your first answer. Your answers stay on your phone.",
  labels:["Not like me","A little like me","Somewhat like me","Mostly like me","Very much like me"],values:[1,2,3,4,5],
  items:["I often come up with new and original ways of doing things.","I am curious about many things and love exploring.","I look at all sides of an issue before deciding.","I love learning new things, even outside class.","Friends come to me for advice; I can see the big picture.","I speak up for what is right, even when it is hard.","I finish what I start, even when it gets difficult.","I am honest and true to myself.","I approach life with energy and excitement.","I have close relationships in which I love and am loved.","I enjoy helping others and doing favours.","I understand what other people feel and what makes them tick.","I work well in a team and do my share.","I treat everyone fairly, without bias.","I am good at organising groups and getting things done together.","I forgive people who have wronged me.","I let my actions speak; I don’t seek the spotlight.","I think carefully before I act and avoid unnecessary risks.","I control my emotions and habits well.","I notice and appreciate beauty and excellence around me.","I feel thankful for the good things in my life and show it.","I expect the best in the future and work to achieve it.","I like to laugh and bring a smile to other people.","My faith or sense of purpose guides my life."],
  score(a){const N=["Creativity","Curiosity","Judgement","Love of learning","Perspective","Bravery","Perseverance","Honesty","Zest","Love","Kindness","Social intelligence","Teamwork","Fairness","Leadership","Forgiveness","Humility","Prudence","Self-regulation","Appreciation of beauty","Gratitude","Hope","Humour","Spirituality"];
   const V=["Wisdom","Wisdom","Wisdom","Wisdom","Wisdom","Courage","Courage","Courage","Courage","Humanity","Humanity","Humanity","Justice","Justice","Justice","Temperance","Temperance","Temperance","Temperance","Transcendence","Transcendence","Transcendence","Transcendence","Transcendence"];
   const o=a.map((v,i)=>[v,i]).sort((x,y)=>y[0]-x[0]||x[1]-y[1]).slice(0,5);
   const vc={};o.forEach(x=>vc[V[x[1]]]=(vc[V[x[1]]]||0)+1);const top=Object.entries(vc).sort((x,y)=>y[1]-x[1])[0][0];
   return {main:5,max:5,label:"Your top 5 strengths",
    text:o.map((x,i)=>(i+1)+". "+N[x[1]]).join(" · ")+". Most of them belong to the virtue of "+top+".",
    detail:"Ask yourself: does each one feel like the real you? Do you enjoy using it? Does it energise you? A short classroom version with one item per strength, not the official VIA Survey (free at viacharacter.org)."}}},
 real10:{day:101,chap:"Chapter 10 · Part 1",kind:"Quick check",title:"Strength, learned behaviour or weakness?",sub:"The four strengths dimensions · 5 scenarios",type:"quiz",intro:"Is it a realised strength, an unrealised strength, a learned behaviour or a weakness?",
  items:[
   {q:"Yousef is great at presenting, does it in most classes, and feels energised afterwards.",o:["Realised strength","Unrealised strength","Learned behaviour","Weakness"],a:0,why:"He is good at it, enjoys it and uses it often."},
   {q:"Bader loves mentoring younger students and feels alive when he does it, but his job gives him no chance to.",o:["Realised strength","Unrealised strength","Learned behaviour","Weakness"],a:1,why:"Energising and done well, but rarely used: an unrealised strength to develop."},
   {q:"Faisal is very good at detailed spreadsheets, but they drain him completely.",o:["Realised strength","Unrealised strength","Learned behaviour","Weakness"],a:2,why:"Done well but draining: a learned behaviour to moderate."},
   {q:"Hamad finds public negotiation stressful and is not good at it.",o:["Realised strength","Unrealised strength","Learned behaviour","Weakness"],a:3,why:"Not done well and draining: a weakness to manage, for example by partnering with someone strong in it."},
   {q:"According to the strengths approach, what should Faisal do about the spreadsheets?",o:["Do more of them to prove himself","Moderate them: share, swap or limit the task","Ignore his feelings","Quit his job immediately"],a:1,why:"Learned behaviours should be moderated so they don’t drain you."}]},
 quiz10a:{day:101,chap:"Chapter 10 · Part 1",kind:"Quiz",title:"Part 1 exit quiz",sub:"6 scenarios · instant feedback",type:"quiz",
  items:[
   {q:"Talal has a gift for football but never trains. Saud is kind every day without trying. Who shows a talent rather than a strength?",o:["Talal","Saud","Both","Neither"],a:0,why:"Talents are more innate and can be wasted; character strengths show up naturally in daily life and are morally valued."},
   {q:"Which is NOT a criterion for a character strength?",o:["It is valued morally in its own right","It shows across situations and time","Using it makes others look worse","Society has rituals or institutions that build it"],a:2,why:"Displaying a strength does not diminish others; it may even benefit them."},
   {q:"Nasser wants to boost his well-being with his top strength, curiosity. What does research suggest?",o:["Avoid using it at work","Use it in a new way every day for a week","Focus only on his weaknesses","Wait until it changes"],a:1,why:"Using signature strengths in new ways raised happiness and lowered depressive symptoms for up to 6 months."},
   {q:"Across 75 countries, which strengths did people most often say were like them?",o:["Self-regulation and modesty","Honesty, fairness and kindness","Leadership and bravery","Prudence and spirituality"],a:1,why:"Honesty, fairness, kindness, judgement and curiosity were most endorsed, with strong similarity across nations."},
   {q:"After recovering from a serious illness, Khaled notices more gratitude and appreciation of beauty. This suggests…",o:["Strengths never change","Strengths can change with life experiences","He was wrong about his strengths before","Illness only harms strengths"],a:1,why:"Strengths can shift over time and after major events such as illness or tragedy."},
   {q:"Which strengths are most strongly linked to life satisfaction?",o:["Hope, zest, gratitude, love and curiosity","Prudence and humility","Leadership and teamwork","Creativity and judgement"],a:0,why:"These ‘heart’ strengths have the strongest links with life satisfaction."}]},
 virtue10:{day:101,chap:"Chapter 10 · Part 1",kind:"Poll",title:"Our signature strengths",sub:"One tap · live class results",type:"poll",items:[
